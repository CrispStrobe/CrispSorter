[workspace]
[package]
name = "trash-receipt-contract"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
path = "lib.rs"
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
