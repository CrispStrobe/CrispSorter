[workspace]
[package]
name = "ocr-layout-contract"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
path = "lib.rs"
[dependencies]
anyhow = "=1.0.102"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
tempfile = "=3.27.0"
[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
[profile.dev]
debug = 0
