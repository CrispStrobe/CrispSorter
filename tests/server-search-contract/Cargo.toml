[workspace]

[package]
name = "server-search-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
sha2 = "0.10"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = "0.1"
arrow = { version = "57", default-features = false }
arrow-array = { version = "57", default-features = false }
arrow-schema = { version = "57", default-features = false }
arrow-select = { version = "57", default-features = false }
futures-util = "0.3"
lancedb = { version = "=0.26.2", default-features = false }
lance = { version = "2.0.0", default-features = false }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
crisp-index-protocol = { path = "../../crisp-index-protocol" }
crisp-search-query = { path = "../../crates/crisp-search-query" }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.22"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0

[build-dependencies]
protoc-bin-vendored = "3"

[patch.crates-io]
lance-linalg = { path = "../../patches/lance-linalg" }
