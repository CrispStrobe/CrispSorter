[workspace]
[package]
name = "oauth-proxy-contract"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
path = "lib.rs"
[dependencies]
anyhow = "=1.0.102"
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
uuid = { version = "=1.23.3", features = ["v4"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "native-tls", "socks"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync"] }
mockito = "=1.7.2"
[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
