[workspace]

[package]
name = "storage-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
anyhow = "=1.0.102"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "=3.27.0"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "=1.23.3", features = ["v4"] }

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
