[workspace]

[package]
name = "storage-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
anyhow = "=1.0.102"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "=3.27.0"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "=1.23.3", features = ["v4"] }

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Ioctl", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
