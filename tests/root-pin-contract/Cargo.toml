[workspace]
[package]
name = "root-pin-contract"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
path = "lib.rs"
[dependencies]
anyhow = "=1.0.102"
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
rustls = { version = "=0.23.40", default-features = false, features = ["std", "ring", "tls12"] }
# Match the application's locked verifier/parser versions in this isolated crate.
rustls-webpki = { version = "=0.103.13", default-features = false }
rustls-pki-types = { version = "=1.14.1", default-features = false }
