[workspace]

[package]
name = "extraction-contract"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.98"

[lib]
path = "lib.rs"

[dependencies]
anyhow = "=1.0.102"
mail-parser = { version = "=1.0.1", features = ["full_encoding"] }
scraper = { version = "=0.25.0", default-features = false }
encoding_rs = "=0.8.35"
tempfile = "=3.27.0"
zip = { version = "=7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = "=1.1.9"
tar = { version = "=0.4.46", default-features = false }
sevenz-rust2 = { version = "=0.25.0", default-features = false }
quick-xml = "=0.38.4"
crisp-index-protocol = { path = "../../crisp-index-protocol" }
sha2 = "=0.10.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("desktop"))'] }

[patch.crates-io]
sevenz-rust2 = { path = "../../patches/sevenz-rust2" }
