[package]
name = "tauri-app"
version = "0.1.7"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.5.7"
tauri-plugin-store = "2.0.0-rc.0"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
futures-util = "0.3.32"
tauri-plugin-shell = "2.3.5"
tauri-plugin-process = "2.3.1"
tokio = { version = "1.50.0", features = ["full"] }
anyhow = "1.0.102"
pdf-extract = "0.10.0"

# RAG / Search
# lancedb 0.26.2 is the latest stable on crates.io.
# 0.27.0-beta.5 is git-only and adds nothing relevant (JS native arrays, Lance rc bump).
lancedb      = { version = "0.26.2", default-features = false }
tantivy      = "0.22"
deunicode    = "1.6.0"
hf-hub       = { version = "0.4.3", features = ["tokio"] }
# fastembed 5.x has real EmbeddingModel::BGEM3 (8192-token, multilingual) and
# SparseModel::BGEM3 (multilingual sparse). lancedb has no ort dep so no conflict.
fastembed    = { git = "https://github.com/CrispStrobe/fastembed-rs", branch = "feat/new-model-entries", features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
arrow        = { version = "57", default-features = false }
arrow-array  = { version = "57", default-features = false }
arrow-schema = { version = "57", default-features = false }
arrow-select = { version = "57", default-features = false }
uuid         = { version = "1", features = ["v4", "serde"] }
async-trait  = "0.1"
# ort pinned to match fastembed 5.13.0; used directly for EP types and path-based ONNX loading.
ort          = "=2.0.0-rc.11"
# tokenizers + ndarray are transitive via fastembed; listed explicitly for OrtPathEmbedder.
tokenizers   = { version = "0.22", default-features = false, features = ["onig"] }
ndarray      = "0.17"

[dev-dependencies]
tempfile = "3"
sysinfo = "0.33"

[target.'cfg(target_os = "macos")'.dependencies]
mistralrs = { version = "0.7.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
mistralrs = { version = "0.7.0", features = ["cuda"] }

