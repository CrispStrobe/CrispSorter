[package]
name = "crispsorter"
version = "0.9.0"
description = "CrispSorter — local-first AI document organizer"
authors = ["CrispSorter contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# lance-encoding (transitive via lancedb) needs `protoc` at build time.
# Bundle it so users don't have to install protobuf-compiler separately.
protoc-bin-vendored = "3"

[dependencies]
# Wire-format types shared with the in-tree crisp-index-server backend
# (see ../crisp-index-server). Single source of truth for `IngestChunk`,
# `SearchRequest`, etc. Path dep stays inside the workspace; both crates
# rebuild together when the protocol changes.
crisp-index-protocol = { path = "../crisp-index-protocol" }
crisplens-protocol   = { path = "../crates/crisplens-protocol" }
crispcat             = { path = "../crates/crispcat", features = ["lance"] }

# Document translation pipeline. The `crisp-docx` workspace is a
# sibling checkout (../../crisp-docx). These path deps are
# developer-local — when CI clones the repo standalone the build
# will fail unless that sibling exists. If you need CI to ignore
# them, gate the `translate` module behind a Cargo feature.
crisp-docx-core  = { path = "../../crisp-docx/crates/crisp-docx-core" }
# Default-feature crisp-docx-llm has only the HTTP providers. The
# `translate-nmt` Cargo feature below pulls in CrispASR for the
# offline NMT (m2m100 / wmt21 / madlad / gemma4-e2b) provider.
crisp-docx-llm   = { path = "../../crisp-docx/crates/crisp-docx-llm", default-features = false }
# Alignment + format-transfer optional: only pulled in when the
# `translate-align` Cargo feature is on (it pulls in CrispEmbed which
# compiles the ggml C++ runtime — adds minutes to first build).
crisp-docx-align = { path = "../../crisp-docx/crates/crisp-docx-align", features = ["crispembed"], optional = true }
# (crispembed itself is declared as `[dependencies.crispembed]` lower
# down — already optional, shared with the legacy embedder feature.)
futures          = "0.3"

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.5.7"
tauri-plugin-store = "2.0.0-rc.0"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
# default-features=false drops the native-tls (OpenSSL) backend.
# Desktop gets native-tls (best perf), mobile gets rustls (no system OpenSSL needed).
reqwest = { version = "0.13.2", features = ["json", "stream", "blocking", "cookies", "multipart"] }
# Vendored OpenSSL: cross-compiles OpenSSL from source so Android / iOS
# builds don't need a pre-installed system OpenSSL.  On desktop the
# system libssl is still preferred (vendored only kicks in when the
# system one isn't found).  Transitives that pull openssl-sys
# (fastembed→ort→ureq→native-tls, hf-hub, lancedb) all resolve through
# this single pin.
openssl = { version = "0.10", features = ["vendored"] }
# Used by drives/{filen,internxt,webdav}.rs to stage downloads / uploads
# through a temp dir.  Was previously dev-only; promoted to a runtime dep
# when InternxtDrive started using it for `read_file` / `write_file`.
tempfile = "3"
futures-util = "0.3.32"
tauri-plugin-shell = { version = "2.3.5", optional = true }
tauri-plugin-process = { version = "2.3.1", optional = true }
tokio = { version = "1.50.0", features = ["full"] }
# `ReaderStream` for streaming file uploads to cloud-backup over
# reqwest::Body::wrap_stream (avoids buffering multi-GB files in
# RAM).  tokio-util is already transitive via reqwest+lance — this
# pin just makes the `io` feature directly usable.
tokio-util = { version = "0.7", features = ["io"] }
anyhow = "1.0.102"
pdf-extract = "0.10.0"
# Used by the L2 metadata reader to crack open DOCX (.docx) and EPUB
# archives without a full-DOM XML parser. zip 7 matches the version
# already pulled in transitively via candle-core (mistral.rs).
zip = "7"
# EXIF reader for L2 metadata extraction from JPG / TIFF / WebP / PNG
# images. Pure Rust, no system deps.
kamadak-exif = "0.6"
# `lopdf` is a transitive dep of pdf-extract; pinned here to read the
# /Info dictionary (Title / Author / Subject / Keywords / CreationDate)
# directly. Used by the extract_pdf_metadata Tauri command.
lopdf       = "0.38"
# RSS/Atom feed parser — used for P24.5 feed ingestion.
feed-rs     = "2"
# Cross-platform clipboard access — used for P24.6 clipboard/screenshot capture.
arboard     = "3"
# Word-level text diff — used for P25.7 document comparison.
similar     = { version = "2", features = ["unicode"] }
# DOCX generation — used for P27.10 export to Word format.
docx-rs     = "0.4"
# Cross-platform fs watcher (FSEvents on macOS, inotify on Linux,
# ReadDirectoryChangesW on Windows). Used by the folder-watcher
# feature to auto-add new files into the batch.
notify      = { version = "8", optional = true }
walkdir     = { version = "2", optional = true }
# Streaming XML parser used to read the XMP metadata stream embedded in
# PDFs. quick-xml is already a transitive dep; pinning it explicitly
# guards against future churn from indirect upgrades.
quick-xml   = "0.38"
# ── Catalog (Cathy/Catfish .caf) — drive cataloging + dedup ─────────────────
# jwalk is rayon-backed so a full hard-drive scan uses every core; rayon
# itself is already in our tree (transitively via lance/tantivy/fastembed)
# but pinned here so the catalog module's parallel hashing path doesn't
# silently break if a transitive drops it.
jwalk       = "0.8"
rayon       = "1.10"
md-5        = "0.10"
sha1        = "0.10"
sha2        = "0.10"
hex         = "0.4"

# RAG / Search
# lancedb 0.26.2 is the latest stable on crates.io.
# 0.27.0-beta.5 is git-only and adds nothing relevant (JS native arrays, Lance rc bump).
lancedb      = { version = "0.26.2", default-features = false }
lance        = { version = "2.0.0", default-features = false }
tantivy      = "0.22"
deunicode    = "1.6.0"
hf-hub       = { version = "0.4.3", features = ["tokio"] }
# fastembed 5.x has real EmbeddingModel::BGEM3 (8192-token, multilingual) and
# SparseModel::BGEM3 (multilingual sparse). lancedb has no ort dep so no conflict.
fastembed    = { git = "https://github.com/CrispStrobe/fastembed-rs", branch = "feat/new-model-entries", features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
arrow        = { version = "57", default-features = false }
arrow-array  = { version = "57", default-features = false }
arrow-schema = { version = "57", default-features = false }
arrow-select = { version = "57", default-features = false }
uuid         = { version = "1", features = ["v4", "serde"] }
rusqlite     = { version = "0.39.0", features = ["bundled"] }
async-trait  = "0.1"
# ort pinned to match fastembed 5.13.0; used directly for EP types and path-based ONNX loading.
ort          = "=2.0.0-rc.11"
# tokenizers + ndarray are transitive via fastembed; listed explicitly for OrtPathEmbedder.
tokenizers   = { version = "0.22", default-features = false, features = ["onig"] }
ndarray      = "0.17"
ocrs = "0.12.2"
rten = "0.24.0"
image = "0.25.10"
# Pure-Rust multi-page TIFF decode (page-sourcing for multi-page document OCR).
# Same version the `image` crate uses transitively, so no duplicate.
tiff = "0.9"
# PDF page rasterization for scanned/image PDFs (page-sourcing). Binds PDFium
# at runtime via libloading — compiles without the lib; degrades gracefully if
# absent. Optional (the `pdf-render` feature); the release build bundles a
# per-platform libpdfium next to the binary.
pdfium-render = { version = "0.8", optional = true }
# P13/A4 — perceptual hashing for the near-duplicate image view.
# Active fork (qarmin/img_hash) of the original abonander/img_hash.
# Default features only — `fast_image_resize` is a 2-3x speedup but
# pulls a system SIMD shim we don't need yet at this slice's scale.
image_hasher = "3"
# P13/B1 — cross-platform secret storage for the CrispLens session
# cookie.  Per the spec's risk register: NEVER write the credential
# to tauri-plugin-store JSON (leaks via backup / cloud-sync).  This
# crate uses Keychain on macOS, secret-service / kwallet on Linux,
# DPAPI / Windows Credential Vault on Windows.  Sync API — fine to
# call from blocking pool; never holds an open OS handle past return.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.2"
# PLAN P7.8 Tier 3 — PaddleOCR (DB text-detection + SVTR text-recognition).
# Optional: add --features paddle-ocr to enable. Models auto-download from
# HuggingFace on first use (~50-200 MB). Pinned to alpha.3 because it shares
# our ort = "=2.0.0-rc.11" pin.
usls = { version = "=0.2.0-alpha.3", default-features = false, features = ["vision", "hf-hub"], optional = true }

[dev-dependencies]
sysinfo = "0.33"
# Mock HTTP server for unit tests covering the cloud-backup and
# CrispLens wire commands.  Async API — `Server::new_async()` + the
# `match_query` / `match_header` predicates fit the existing
# `#[tokio::test]` shape.  Adds no runtime weight (dev-only).
mockito = "1.5"

# ── Feature flags ───────────────────────────────────────────────────────────
# `crispembed*` features enable the GGUF-based CrispEmbed alternative backend.
# Pick exactly one backend sub-feature for GGML acceleration:
#   crispembed          — CPU only
#   crispembed-vulkan   — Vulkan (Windows / Linux / anything with a GPU driver)
#   crispembed-metal    — Metal (macOS)
#   crispembed-cuda     — CUDA (NVIDIA)
[features]
default = []
# Desktop-only features that are excluded from mobile builds.
# Mobile builds (Android / iOS) must NOT enable this feature — the
# crates behind it depend on subprocess spawning, inotify, and other
# OS primitives absent on mobile.  CI / release builds for desktop
# should enable it: `cargo build --features desktop`
desktop = ["dep:notify", "dep:walkdir", "dep:tauri-plugin-shell", "dep:tauri-plugin-process", "dep:mistralrs", "reqwest/native-tls"]
# PDF page rasterization for scanned/image PDFs (multi-page OCR). Needs a
# per-platform libpdfium at runtime; bundled by the release build.
pdf-render        = ["dep:pdfium-render"]
# PLAN P7.8 Tier 3 — PaddleOCR text detection + recognition via usls + ort.
# Build with: cargo build --features paddle-ocr
paddle-ocr        = ["dep:usls"]
crispembed        = ["dep:crispembed", "dep:crispembed-sys"]
crispembed-vulkan = ["crispembed", "crispembed/vulkan", "crispembed-sys/vulkan"]
crispembed-metal  = ["crispembed", "crispembed/metal", "crispembed-sys/metal"]
crispembed-cuda   = ["crispembed", "crispembed/cuda", "crispembed-sys/cuda"]

# Translate-pipeline format-preservation. Pulls in crisp-docx-align +
# CrispEmbed (the multilingual encoder) so the `translate_docx` Tauri
# command can take a `preserve_formatting=true` option that runs
# SimAlign over each paragraph's source ↔ translation pair and
# redistributes the source runs' rPr onto the target text.
translate-align = ["dep:crisp-docx-align", "crispembed"]

# Offline NMT via CrispASR. Enables the `ProviderKind::Nmt` variant
# in crisp-docx-llm — wraps `crispasr::Session::translate_text` over
# a GGUF model (m2m100 / wmt21 / madlad / gemma4-e2b). Path-deps
# CrispASR as a sibling checkout. The user picks the .gguf file in
# the Translate tab's model field; no network needed for translation.
translate-nmt   = ["crisp-docx-llm/nmt", "crispasr"]

# ── CrispASR (optional, on-device ASR — Whisper / Qwen3-ASR / FastConformer)
# Mirrors the crispembed feature pattern: pick exactly one backend sub-feature.
# `hound` is intentionally NOT in this list: the WAV writer is always-compile
# so the CLI's `chat tts` path and future GUI "save recording" call sites can
# use `audio::writer::write_wav_mono` without dragging the whole crispasr
# feature into the build.  hound is pure-Rust, no system deps, ~30 KB compiled.
crispasr          = ["dep:crispasr", "dep:crispasr-sys", "dep:symphonia"]
crispasr-vulkan   = ["crispasr", "crispasr/vulkan", "crispasr-sys/vulkan"]
crispasr-metal    = ["crispasr", "crispasr/metal", "crispasr-sys/metal"]
crispasr-cuda     = ["crispasr", "crispasr/cuda", "crispasr-sys/cuda"]

# `[profile.dev.package."*"]` lives at the workspace root (Cargo only
# honours profile tables there; declaring them per-package emits a
# warning and is silently ignored).

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.11" } # Rely on default features for Windows
mistralrs = { version = "0.7.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.11" } # Rely on default features for macOS
mistralrs = { version = "0.7.0", features = ["metal"], optional = true }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
ort = { version = "=2.0.0-rc.11" } # Rely on default features for Linux
mistralrs = { version = "0.7.0", optional = true }

# ── CrispEmbed (optional, GGUF dense/sparse/ColBERT/reranker backend) ───────
# Path dep to the sibling repo. The `crispembed` cargo feature opts this in;
# sub-features pick the GGML backend (defaults to CPU). Enable locally with:
#   cargo build --features crispembed-vulkan   (Windows / Linux)
#   cargo build --features crispembed-metal    (macOS)
[dependencies.crispembed]
path     = "../../CrispEmbed/crispembed"
optional = true

# Direct dep on crispembed-sys (mirrors crispasr-sys/crispasr) so this
# package's build.rs sees `DEP_CRISPEMBED_LIB_DIR` from the
# `links = "crispembed"` metadata channel — required for the runtime
# rpath wiring in src-tauri/build.rs to actually fire (Cargo only
# forwards links metadata to immediate dependents). The crate itself
# is not used from our Rust code; `crispembed` re-exports what we need.
[dependencies.crispembed-sys]
path     = "../../CrispEmbed/crispembed-sys"
optional = true

# ── CrispASR (optional, on-device speech-to-text) ───────────────────────────
# Path dep to the sibling repo, mirroring the CrispEmbed integration. The
# `crispasr` cargo feature opts this in; sub-features pick the GGML backend.
# Enable locally with:
#   cargo build --features crispasr-vulkan   (Windows / Linux)
#   cargo build --features crispasr-metal    (macOS)
[dependencies.crispasr]
path     = "../../CrispASR/crispasr"
optional = true

# Direct dep on crispasr-sys (mirrors `crispasr`'s own dep) so this
# package's build.rs sees `DEP_CRISPASR_LIB_DIR`, which crispasr-sys's
# build script publishes via its `links = "crispasr"` metadata channel.
# We need that to emit the right `cargo:rustc-link-arg=-Wl,-rpath,…`
# entries for the final binary — Cargo only forwards `links` metadata
# to *direct* dependents, so a transitive path won't work. The crate
# itself is unused from our Rust code; `crispasr` re-exports what we
# need.
[dependencies.crispasr-sys]
path     = "../../CrispASR/crispasr-sys"
optional = true

# WAV writer for the CLI `chat tts` subcommand AND for any other
# call site that wants to emit a WAV (the GUI's future "save
# recording" button, the audio module's symphonia round-trip tests).
# Always-compile — pure-Rust, no transitive deps, ~30 KB compiled,
# so the feature-gating overhead isn't worth the build-time savings.
[dependencies.hound]
version = "3.5"

# Multi-codec audio + video demuxing for P13.5 audio vertical.
# Tier 1 of `src-tauri/src/audio/decoder.rs`: WAV / MP3 / M4A / FLAC
# / OGG / OPUS / AAC for audio AND MP4 / MOV / MKV / WebM / M4V for
# video (we demux just the audio stream — no video decode).  Pure-
# Rust, no system deps, ships on every platform CrispSorter does.
# `features = ["all"]` enables every codec + container module the
# umbrella crate offers; the long-tail (.avi DivX, .wmv) goes
# through the ffmpeg shell-out fallback in
# `src-tauri/src/audio/ffmpeg_fallback.rs`.
[dependencies.symphonia]
version  = "0.5"
features = ["all"]
optional = true

# Sample-rate conversion to the canonical 16 kHz mono ASR input
# format is currently done inline in `src-tauri/src/audio/resampler.rs`
# via linear interpolation — same approach whisper.cpp uses internally.
# Quality is fine for ASR (the model is robust to minor aliasing) and
# avoids the dep-surface complexity of rubato 0.16's `SincFixedIn`
# API.  TODO: swap in `rubato` for the few cases (extreme rate ratios)
# where linear interpolation has audible artifacts.

