name: ShellGeometry
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1'
targets:
  GeometryHost:
    type: application
    platform: iOS
    sources:
      - path: Host
      - path: ${OCR_SHELL_RESOURCES}
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crispstrobe.shellGeometry
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  GeometryTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: GeometryHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crispstrobe.shellGeometryTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GeometryHost
schemes:
  ShellGeometry:
    build:
      targets:
        GeometryHost: [test]
        GeometryTests: [test]
    test:
      targets: [GeometryTests]
      gatherCoverageData: false
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
