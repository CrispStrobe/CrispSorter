# Build the real catalog sources and CLI without resolving the desktop
# workspace's optional LanceDB/Tauri dependencies or sibling checkouts.
[workspace]

[package]
name = "crispcat-catalog-harness"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "crispcat"
path = "../../crates/crispcat/src/lib.rs"

[[bin]]
name = "crispcat"
path = "../../crates/crispcat-cli/src/main.rs"

[[test]]
name = "cli_e2e"
path = "../../crates/crispcat-cli/tests/cli_e2e.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
anyhow = "=1.0.102"
rayon = "=1.12.0"
jwalk = "=0.8.1"
md-5 = "=0.10.6"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
hex = "=0.4.3"
clap = { version = "=4.6.1", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("lance"))'] }

[profile.release]
lto = "thin"
