name: OcrShellProbe
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1'
targets:
  ProbeHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crispstrobe.ocrShellProbeHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ShellNavigationTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ProbeHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crispstrobe.ocrShellProbeTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ProbeHost
schemes:
  OcrShellProbe:
    build:
      targets:
        ProbeHost: [test]
        ShellNavigationTests: [test]
    test:
      targets: [ShellNavigationTests]
      gatherCoverageData: false
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
