name: Dart and Rust provider compatibility
# The Filen/Internxt clients are git dependencies on crisp-cloud-rs. This
# workflow verifies exactly the revision src-tauri/Cargo.toml pins (and
# Cargo.lock resolved): scripts/crisp_cloud_rev.py is the single source of
# truth and fails if the manifest entries and the lock file disagree.
on:
  push:
    paths: ['src-tauri/Cargo.toml', 'Cargo.lock', 'scripts/crisp_cloud_rev.py', 'src-tauri/src/drives/**', 'docs/STORAGE_ENGINE_ARCHITECTURE.md', '.github/workflows/provider-conformance.yml']
  pull_request:
    paths: ['src-tauri/Cargo.toml', 'Cargo.lock', 'scripts/crisp_cloud_rev.py', 'src-tauri/src/drives/**', 'docs/STORAGE_ENGINE_ARCHITECTURE.md', '.github/workflows/provider-conformance.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the crisp-cloud-rs revision CrispSorter depends on
        id: cloud
        run: python3 scripts/crisp_cloud_rev.py --github-output
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/crisp-cloud-rs
          ref: ${{ steps.cloud.outputs.rev }}
          path: _provider_conformance
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _provider_conformance/conformance/rust -> target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.0
      - name: Check golden vectors, HTTP mocks and cross-decryption
        # The checkout's own crates are the pinned revision, so no
        # --rust-filen/--rust-internxt override is needed.
        run: python _provider_conformance/conformance/run.py --pointycastle 4.0.0 --dart-pg 2.1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-conformance
          path: |
            _provider_conformance/conformance/results/
            _provider_conformance/conformance/dart/pubspec.lock
            _provider_conformance/conformance/rust/Cargo.lock
          retention-days: 14
  native-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the crisp-cloud-rs revision CrispSorter depends on
        id: cloud
        run: python3 scripts/crisp_cloud_rev.py --github-output
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/crisp-cloud-rs
          ref: ${{ steps.cloud.outputs.rev }}
          path: _provider_units
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _provider_units -> target
      - name: Native provider unit and mock tests
        working-directory: _provider_units
        run: cargo test -p crisp-filen -p crisp-internxt --lib
