name: OCR paired native integration

on:
  workflow_dispatch:
  push:
    branches: ['feat/ocr-document-studio']
    paths:
      - src-tauri/src/ocr_workspace.rs
      - src-tauri/src/ocr_text_export.rs
      - src-tauri/src/ocr_atomic_output.rs
      - src-tauri/src/ocr_export_control.rs
      - src-tauri/src/ocr_document_import.rs
      - src-tauri/src/ocr_asset_store.rs
      - tests/fixtures/mobile-documents/**
      - src-tauri/src/ocr_photo.rs
      - src-tauri/src/model_provisioning.rs
      - src-tauri/src/model_storage.rs
      - src-tauri/src/model_storage_types.rs
      - src-tauri/src/index/tauri_commands.rs
      - src-tauri/src/extractors/image_input.rs
      - src-tauri/src/extractors/mod.rs
      - src-tauri/src/model_provisioning/**
      - src-tauri/src/lib.rs
      - src-tauri/Cargo.toml
      - Cargo.lock
      - src-tauri/src/main.rs
      - src-tauri/src/cli/mod.rs
      - src-tauri/tauri.conf.json
      - src/app.html
      - src/app.css
      - src/routes/+page.svelte
      - scripts/desktop_ocr_startup_smoke.py
      - scripts/generate-licenses.js
      - scripts/native_license_inventory.mjs
      - tests/scripts/test_native_license_inventory.mjs
      - tests/scripts/test_desktop_startup.py
      - .github/workflows/ocr-paired-native.yml
  pull_request:
    paths:
      - src-tauri/src/ocr_workspace.rs
      - src-tauri/src/ocr_text_export.rs
      - src-tauri/src/ocr_atomic_output.rs
      - src-tauri/src/ocr_export_control.rs
      - src-tauri/src/ocr_document_import.rs
      - src-tauri/src/ocr_asset_store.rs
      - tests/fixtures/mobile-documents/**
      - src-tauri/src/ocr_photo.rs
      - src-tauri/src/model_provisioning.rs
      - src-tauri/src/model_storage.rs
      - src-tauri/src/model_storage_types.rs
      - src-tauri/src/index/tauri_commands.rs
      - src-tauri/src/extractors/image_input.rs
      - src-tauri/src/extractors/mod.rs
      - src-tauri/src/model_provisioning/**
      - src-tauri/src/lib.rs
      - src-tauri/src/ocr_reading_order.rs
      - src-tauri/src/ocr_word_evidence.rs
      - src-tauri/src/ocr_document.rs
      - src-tauri/src/ocr_office.rs
      - src-tauri/src/ocr_docx.rs
      - src-tauri/src/ocr_xlsx.rs
      - Cargo.lock
      - src-tauri/src/extractors/ocr_crispembed.rs
      - src-tauri/src/extractors/ocr_render.rs
      - src-tauri/src/extractors/page_source.rs
      - src-tauri/Cargo.toml
      - src-tauri/src/main.rs
      - src-tauri/src/cli/mod.rs
      - src-tauri/tauri.conf.json
      - src/app.html
      - src/app.css
      - src/routes/+page.svelte
      - scripts/desktop_ocr_startup_smoke.py
      - scripts/generate-licenses.js
      - scripts/native_license_inventory.mjs
      - tests/scripts/test_native_license_inventory.mjs
      - tests/scripts/test_desktop_startup.py
      - .github/workflows/ocr-paired-native.yml

permissions:
  contents: read

concurrency:
  group: ocr-paired-native-${{ github.ref }}
  # Finish the active source-paired check so incremental saves retain useful
  # native diagnostics and the build cache. GitHub keeps only the latest pending
  # successor in this group; that source still needs its own complete result.
  cancel-in-progress: false

env:
  # A source build and Rust binding from the SAME immutable revision. Do not
  # reuse a released binary with a newer binding: that would skip the ABI check.
  OCR_CRISPEMBED_REF: e14136d3a99572367e68619045943fe77a299caa  # CrispEmbed v0.17.18
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  paired:
    runs-on: ubuntu-latest
    # Cold desktop code generation/linking includes mistralrs; checking its Rust
    # metadata alone does not prove the executable links or starts.
    timeout-minutes: 120
    env:
      LICENSES_REQUIRE: '1'
      LICENSES_CARGO_TARGET: x86_64-unknown-linux-gnu
      LICENSES_CARGO_FEATURES: desktop,ocr-workspace
    steps:
      - name: Set native license metadata path on the runner
        shell: bash
        run: echo "LICENSES_CARGO_METADATA=$RUNNER_TEMP/ocr-desktop-licenses/cargo-metadata.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: repos/CrispSorter
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: ${{ env.OCR_CRISPEMBED_REF }}
          submodules: recursive
          path: repos/CrispEmbed
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repos/CrispSorter/package-lock.json
      - name: Verify desktop evidence rejection controls
        working-directory: repos/CrispSorter
        run: python3 -m unittest discover -s tests/scripts -p test_desktop_startup.py -v
      - name: Verify locked native license inventory controls
        working-directory: repos/CrispSorter
        run: node --test tests/scripts/test_native_license_inventory.mjs
      - name: Verify conservative reading-order permutations
        working-directory: repos/CrispSorter
        run: |
          rustc --edition 2021 --test src-tauri/src/ocr_reading_order.rs -o "$RUNNER_TEMP/ocr-reading-order-tests"
          "$RUNNER_TEMP/ocr-reading-order-tests"
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf protobuf-compiler libssl-dev xvfb xauth dbus-x11 xdotool imagemagick libgl1-mesa-dri ripgrep
      - name: Build matching native OCR library and serialization/export tests
        run: |
          cmake -S repos/CrispEmbed -B repos/CrispEmbed/build \
            -DCMAKE_BUILD_TYPE=Release -DCRISPEMBED_BUILD_SHARED=ON \
            -DCRISPEMBED_NATIVE=OFF -DGGML_NATIVE=OFF \
            -DGGML_BLAS=OFF -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_VULKAN=OFF
          cmake --build repos/CrispEmbed/build --target crispembed-shared test-ocr-review test-ocr-render --parallel 2
          repos/CrispEmbed/build/test-ocr-review
          repos/CrispEmbed/build/test-ocr-render
      # Resolve the application's optional sibling Cargo paths AFTER configuring
      # the OCR-only native library, so unrelated audio integrations stay off.
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispASR
          ref: v0.8.32
          path: repos/CrispASR
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/crisp-docx
          ref: ddf7830d8d92e6b59b10874d144a59f163a256e1
          path: repos/crisp-docx
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos/CrispSorter -> target
          shared-key: ocr-paired-native
          cache-on-failure: true
      - name: Build the production desktop frontend
        working-directory: repos/CrispSorter
        run: |
          npm ci
          node scripts/native_license_inventory.mjs prepare --output "$LICENSES_CARGO_METADATA"
          npm run build
          node scripts/native_license_inventory.mjs verify
          cp static/licenses.json "$RUNNER_TEMP/ocr-desktop-licenses/licenses.json"
      - name: Execute paired native Rust writer contracts
        working-directory: repos/CrispEmbed
        env:
          CRISPEMBED_SYS_LIB_DIR: ${{ github.workspace }}/repos/CrispEmbed/build
          LD_LIBRARY_PATH: ${{ github.workspace }}/repos/CrispEmbed/build:${{ github.workspace }}/repos/CrispEmbed/build/ggml/src
          OCR_WRITER_ARTIFACTS: ${{ runner.temp }}/ocr-paired-writer
        run: |
          cargo test --locked -p crispembed --test ocr_writer_contract -- --test-threads=1
      - name: Verify application against paired native source
        working-directory: repos/CrispSorter
        env:
          CRISPEMBED_SYS_LIB_DIR: ${{ github.workspace }}/repos/CrispEmbed/build
          LD_LIBRARY_PATH: ${{ github.workspace }}/repos/CrispEmbed/build:${{ github.workspace }}/repos/CrispEmbed/build/ggml/src
        run: |
          mkdir -p build src-tauri/bin
          touch src-tauri/bin/.gitkeep
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            ocr_workspace:: -- --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            ocr_text_export::tests -- --list | rg '^ocr_text_export::tests::.*: test$'
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            ocr_text_export::tests -- --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            ocr_photo::tests -- --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            model_provisioning -- --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            extractors::ocr_crispembed::tests -- --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            extractors::tests::incomplete_jpeg_cannot_reach_an_ocr_fallback -- --list \
            | rg '^extractors::tests::incomplete_jpeg_cannot_reach_an_ocr_fallback: test$'
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            extractors::tests::incomplete_jpeg_cannot_reach_an_ocr_fallback -- --exact --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            extractors::page_source::tests -- --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            ocr_reading_order::tests -- --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            ocr_word_evidence::tests -- --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            ocr_document::tests -- --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            ocr_office::tests -- --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            ocr_docx::tests -- --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            ocr_xlsx::tests -- --test-threads=1
          cargo test --locked -p crispsorter --lib --no-default-features \
            --features ocr-workspace \
            extractors::ocr_render::tests -- --test-threads=1
          cargo check --locked -p crispsorter --lib --no-default-features \
            --features ocr-mobile
      - name: Link the complete Linux desktop OCR executable
        working-directory: repos/CrispSorter
        env:
          CRISPEMBED_SYS_LIB_DIR: ${{ github.workspace }}/repos/CrispEmbed/build
          LD_LIBRARY_PATH: ${{ github.workspace }}/repos/CrispEmbed/build:${{ github.workspace }}/repos/CrispEmbed/build/ggml/src
        run: |
          cargo build --locked -p crispsorter --bin crispsorter --no-default-features \
            --features desktop,ocr-workspace
      - name: Execute desktop CLI and observe the production application startup
        working-directory: repos/CrispSorter
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/repos/CrispEmbed/build:${{ github.workspace }}/repos/CrispEmbed/build/ggml/src
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- \
            python3 scripts/desktop_ocr_startup_smoke.py \
              --source . --native-source ../CrispEmbed \
              --binary target/debug/crispsorter \
              --native-library ../CrispEmbed/build/libcrispembed.so \
              --frontend build --output test-results/desktop-startup
      - name: Save desktop execution evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-paired-desktop-startup-linux
          path: repos/CrispSorter/test-results/desktop-startup
          if-no-files-found: warn
          retention-days: 14
      - name: Save native diagnostics library
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-paired-native-linux
          path: |
            repos/CrispEmbed/build/libcrispembed*.so*
            repos/CrispEmbed/build/ggml/src/libggml*.so*
            ${{ runner.temp }}/ocr-paired-writer/
            ${{ runner.temp }}/ocr-desktop-licenses/
          if-no-files-found: warn
          retention-days: 14
