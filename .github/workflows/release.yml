name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M1+)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install CUDA Toolkit (Windows)
        if: matrix.platform == 'windows-latest'
        uses: jimderoert/setup-cuda@v2
        with:
          cuda_version: '12.4.1'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Download llama-server binaries (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p src-tauri/bin
          # Download llama.cpp release b8340 for macOS (tar.gz)
          wget https://github.com/ggml-org/llama.cpp/releases/download/b8340/llama-b8340-bin-macos-arm64.tar.gz -O llama-mac-arm64.tar.gz
          wget https://github.com/ggml-org/llama.cpp/releases/download/b8340/llama-b8340-bin-macos-x64.tar.gz -O llama-mac-x64.tar.gz
          mkdir mac-arm64 && tar -xzf llama-mac-arm64.tar.gz -C mac-arm64
          mkdir mac-x64 && tar -xzf llama-mac-x64.tar.gz -C mac-x64
          # Move and rename to match expected sidecar names
          # Note: The tarball extracts into a folder named llama-b8340/
          cp mac-arm64/llama-b8340/llama-server src-tauri/bin/llama-server-aarch64-apple-darwin
          cp mac-x64/llama-b8340/llama-server src-tauri/bin/llama-server-x86_64-apple-darwin
          # Also copy dylibs to bin/ so they are bundled as resources
          cp mac-arm64/llama-b8340/*.dylib src-tauri/bin/ || true
          cp mac-x64/llama-b8340/*.dylib src-tauri/bin/ || true

      - name: Download llama-server binaries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin
          $BuildTag = "b8340"
          $BaseUrl = "https://github.com/ggml-org/llama.cpp/releases/download/$BuildTag"
          
          # Download main server (CPU/Vulkan build contains the base server)
          Invoke-WebRequest -Uri "$BaseUrl/llama-$BuildTag-bin-win-vulkan-x64.zip" -OutFile llama-win.zip
          Expand-Archive -Path llama-win.zip -DestinationPath win-bin -Force
          # llama-server.exe is in the root of the zip
          Copy-Item win-bin/llama-server.exe src-tauri/bin/llama-server-x86_64-pc-windows-msvc.exe
          Copy-Item win-bin/*.dll src-tauri/bin/
          
          # Download CUDA runtime for Windows
          Invoke-WebRequest -Uri "$BaseUrl/cudart-llama-bin-win-cuda-13.1-x64.zip" -OutFile cudart.zip
          Expand-Archive -Path cudart.zip -DestinationPath cudart -Force
          Copy-Item cudart/*.dll src-tauri/bin/

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # the Action will replace this with the app version
          releaseName: 'CrispSorter v__VERSION__'
          releaseBody: 'Automated release from GitHub Actions.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
