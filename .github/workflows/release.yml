name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Flip the built draft to the PUBLIC Latest release. Leave OFF to only build/test (e.g. exercise the crispembed compile) and keep the draft unpublished.'
        type: boolean
        default: false

# ── Sibling-repo version pins (single source of truth) ──────────────
# Bumping CRISPEMBED_REF / CRISPASR_REF / CRISPDOCX_REF here updates
# all jobs at once — no more 3-place edits.
env:
  CRISPEMBED_REPO: CrispStrobe/CrispEmbed
  CRISPEMBED_REF: v0.13.0
  CRISPASR_REPO: CrispStrobe/CrispASR
  CRISPASR_REF: v0.8.6
  CRISPDOCX_REPO: CrispStrobe/crisp-docx
  CRISPDOCX_REF: b1de892c6092bdf3306e442138475a7f94c19637
  # App Store Connect API key (public identifiers — not secrets).
  # The .p8 private key itself is in APPLE_API_KEY_P8 repo secret (base64).
  APPLE_API_KEY_ID: 9RMU3C7422
  APPLE_API_ISSUER_ID: 5f618ba3-98ef-42ad-835c-fbbef6c76cf5

jobs:
  release-required:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            rust_target: aarch64-apple-darwin
            llama_asset: llama-b8340-bin-macos-arm64.tar.gz
            sidecar_name: llama-server-aarch64-apple-darwin
            # crispasr-metal + crispembed-metal turn on the on-device
            # ASR + GGUF embedder/reranker backends; the
            # libcrispasr.dylib / libcrispembed.dylib + ggml libs come
            # from each project's release asset (downloaded below).
            # `translate-align` + `translate-nmt` enable the v0.2 docx
            # translator's intra-paragraph format preservation (via
            # crisp-docx-align over CrispEmbed) and the offline NMT
            # backend (via crisp-docx-llm/nmt over CrispASR). Both add
            # no new C++ — the embedder + ASR libs are already
            # downloaded above for crispasr-metal / crispembed-metal.
            # `desktop` is REQUIRED: P17 gated tauri-plugin-shell (+ notify,
            # process, mistralrs, native-tls) behind it, but default = [].
            # Without it the shell plugin isn't compiled and the
            # capabilities/default.json `shell:default` permission fails to
            # resolve in build.rs ("shell:default not found") — which is what
            # broke every v0.5.0 desktop build and published an empty release.
            tauri_args: '--target aarch64-apple-darwin --features desktop,crispasr-metal,crispembed-metal,translate-align,translate-nmt,pdf-render'
            # When set, the matching tarballs are downloaded from each
            # repo's release and extracted into the path that the
            # corresponding -sys crate's `try_existing_build`
            # auto-discovers.
            crispasr_lib_asset: libcrispasr-macos-arm64.tar.gz
            crispembed_lib_asset: crispembed-macos-arm64.tar.gz
            # libpdfium for the `pdf-render` feature (scanned-PDF → page
            # rasterization). Staged into src-tauri/bin/ → bundled as a
            # resource. bblanchon/pdfium-binaries asset + the path of the
            # shared lib inside the tarball.
            pdfium_asset: pdfium-mac-arm64.tgz
            pdfium_lib_glob: 'lib/libpdfium.dylib'
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            llama_asset: llama-b8340-bin-win-vulkan-x64.zip
            sidecar_name: llama-server-x86_64-pc-windows-msvc.exe
            # v0.2.0 enables the same translate-align + translate-nmt
            # features as macOS/Linux. Windows resolves co-located DLLs
            # by searching alongside the .exe — so the post-bundle step
            # below copies libcrispembed.dll + libcrispasr.dll + ggml*
            # next to crispsorter.exe in `target/release/`, and the
            # `windows-portable-zip` step zips that directory as the
            # primary Windows release artifact. The NSIS installer
            # tauri-action produces is broken (DLLs at
            # resources/bin/ which the loader can't find), so we
            # delete it from the release in the same post-step. Users
            # download the portable .zip, unzip, run.
            tauri_args: '--features desktop,crispasr-vulkan,crispembed-vulkan,translate-align,translate-nmt,pdf-render'
            crispasr_lib_asset: libcrispasr-windows-x86_64-vulkan.tar.gz
            crispembed_lib_asset: crispembed-windows-x86_64.zip
            pdfium_asset: pdfium-win-x64.tgz
            pdfium_lib_glob: 'bin/pdfium.dll'
          - platform: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            llama_asset: llama-b8340-bin-ubuntu-vulkan-x64.tar.gz
            sidecar_name: llama-server-x86_64-unknown-linux-gnu
            # Same translate features as macOS — see the comment there
            # for what these enable. The crispembed + crispasr libs are
            # already pulled in by the vulkan variants.
            tauri_args: '--bundles deb --features desktop,crispasr-vulkan,crispembed-vulkan,translate-align,translate-nmt,pdf-render'
            crispasr_lib_asset: libcrispasr-linux-x86_64.tar.gz
            crispembed_lib_asset: crispembed-linux-x86_64.tar.gz
            pdfium_asset: pdfium-linux-x64.tgz
            pdfium_lib_glob: 'lib/libpdfium.so'

    runs-on: ${{ matrix.platform }}

    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Check out sibling CrispEmbed
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: _sibling/CrispEmbed

      - name: Check out sibling CrispASR
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: _sibling/CrispASR

      - name: Check out sibling crisp-docx
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPDOCX_REPO }}
          ref: ${{ env.CRISPDOCX_REF }}
          path: _sibling/crisp-docx

      - name: Download libcrispasr bundle (Unix)
        if: matrix.crispasr_lib_asset != '' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Pull the per-platform libcrispasr lib bundle that CrispASR's
          # release publishes and extract it into the path crispasr-sys's
          # `try_existing_build` walks first — so cargo build skips its
          # own cmake step entirely and just links against the pre-built
          # lib. Same `build-flutter-bundle/` convention macOS uses.
          URL="https://github.com/${{ env.CRISPASR_REPO }}/releases/download/${{ env.CRISPASR_REF }}/${{ matrix.crispasr_lib_asset }}"
          echo "Downloading $URL"
          curl -fL -o crispasr-libs.tar.gz "$URL"
          mkdir -p _sibling/CrispASR/build-flutter-bundle
          # Tarball top-level dir is `libcrispasr-<platform>/`; strip it
          # so contents land directly under build-flutter-bundle/.
          tar -xzf crispasr-libs.tar.gz \
            -C _sibling/CrispASR/build-flutter-bundle \
            --strip-components=1
          echo "Extracted libs:"
          find _sibling/CrispASR/build-flutter-bundle -maxdepth 4 \
            \( -name "lib*" -o -name "*.dll" -o -name "*.lib" \) 2>/dev/null | head -30

      - name: Download libcrispasr bundle (Windows)
        if: matrix.crispasr_lib_asset != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/${{ env.CRISPASR_REPO }}/releases/download/${{ env.CRISPASR_REF }}/${{ matrix.crispasr_lib_asset }}"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile crispasr-libs.tar.gz
          New-Item -ItemType Directory -Force -Path _sibling/CrispASR/build-flutter-bundle | Out-Null
          # tar ships with Win10+. --strip-components flattens the
          # top-level `libcrispasr-windows-*-vulkan/` dir like Unix.
          tar -xzf crispasr-libs.tar.gz -C _sibling/CrispASR/build-flutter-bundle --strip-components=1
          Write-Host "Extracted libs:"
          Get-ChildItem -Recurse _sibling/CrispASR/build-flutter-bundle -Include "*.dll","*.lib" | Select-Object -First 30 FullName | Format-Table -HideTableHeaders

      - name: Download libcrispembed bundle (Unix)
        if: matrix.crispembed_lib_asset != '' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # CrispEmbed Linux/macOS publish flat tarballs: libcrispembed +
          # libggml* all at the top level. crispembed-sys's
          # `try_existing_build` walks `<build>/`, `<build>/build/`, etc.,
          # and `has_prebuilt` looks for libcrispembed.* directly in
          # those dirs — so dropping the tarball contents into
          # `<sibling>/build/` is enough.
          URL="https://github.com/${{ env.CRISPEMBED_REPO }}/releases/download/${{ env.CRISPEMBED_REF }}/${{ matrix.crispembed_lib_asset }}"
          echo "Downloading $URL"
          curl -fL -o crispembed-libs.tar.gz "$URL"
          mkdir -p _sibling/CrispEmbed/build
          tar -xzf crispembed-libs.tar.gz -C _sibling/CrispEmbed/build
          echo "Extracted libs:"
          find _sibling/CrispEmbed/build -maxdepth 2 -name "lib*" 2>/dev/null | head

      - name: Download libcrispembed bundle (Windows)
        if: matrix.crispembed_lib_asset != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/${{ env.CRISPEMBED_REPO }}/releases/download/${{ env.CRISPEMBED_REF }}/${{ matrix.crispembed_lib_asset }}"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile crispembed-libs.zip
          New-Item -ItemType Directory -Force -Path _sibling/CrispEmbed/build | Out-Null
          # CrispEmbed Windows zip is FLAT (crispembed.dll, ggml*.dll,
          # *.lib + include/) — no top-level dir to strip.
          Expand-Archive -Path crispembed-libs.zip -DestinationPath _sibling/CrispEmbed/build -Force
          Write-Host "Extracted libs:"
          Get-ChildItem _sibling/CrispEmbed/build -Include "*.dll","*.lib" -Recurse | Select-Object FullName | Format-Table -HideTableHeaders

      # libpdfium for the `pdf-render` feature. Staged into src-tauri/bin/ so
      # Tauri's `bin/*` resource glob bundles it into resources/bin/ (same path
      # the llama-server sidecar uses); rasterize_pdf() searches that location
      # relative to the exe at runtime. The PDF arm degrades gracefully if the
      # lib is missing/unloadable (falls back to the legacy tesseract path), so
      # a bundling miss is a soft-fail, not a broken release. Skipped on the
      # macOS-Intel optional job (no pdfium_asset set).
      - name: Download libpdfium (Unix)
        if: matrix.pdfium_asset != '' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium_asset }}"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o pdfium.tgz
          mkdir -p _pdfium src-tauri/bin
          tar -xzf pdfium.tgz -C _pdfium
          cp "_pdfium/${{ matrix.pdfium_lib_glob }}" src-tauri/bin/
          ls -la src-tauri/bin/

      - name: Download libpdfium (Windows)
        if: matrix.pdfium_asset != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium_asset }}"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force -Path _pdfium, src-tauri/bin | Out-Null
          tar -xzf pdfium.tgz -C _pdfium
          Copy-Item "_pdfium/${{ matrix.pdfium_lib_glob }}" src-tauri/bin/ -Force
          Get-ChildItem src-tauri/bin/

      - name: Rewrite sibling path deps for CI layout
        shell: bash
        run: |
          python -c "
          import re, pathlib
          p = pathlib.Path('src-tauri/Cargo.toml')
          s = p.read_text()
          # Handle both '../../CrispEmbed/<sub>' and '../../CrispASR/<sub>'.
          # The capture group lets us cover crispasr, crispasr-sys, crispembed,
          # crispembed-sys, etc. without per-sub regex churn.
          s = re.sub(
              r'path\s*=\s*\"\\.\\./\\.\\./CrispEmbed/([\\w-]+)\"',
              r'path = \"../_sibling/CrispEmbed/\1\"',
              s,
          )
          s = re.sub(
              r'path\s*=\s*\"\\.\\./\\.\\./CrispASR/([\\w-]+)\"',
              r'path = \"../_sibling/CrispASR/\1\"',
              s,
          )
          # crisp-docx path deps include the extra 'crates/' intermediate
          # dir: ../../crisp-docx/crates/<sub>. Map them under _sibling/
          # so the rewritten layout mirrors the on-disk dev checkout.
          s = re.sub(
              r'path\s*=\s*\"\\.\\./\\.\\./crisp-docx/crates/([\\w-]+)\"',
              r'path = \"../_sibling/crisp-docx/crates/\1\"',
              s,
          )
          p.write_text(s)
          print(s[s.find('[dependencies.crispembed]'):s.find('[dependencies.crispembed]')+200])
          print(s[s.find('[dependencies.crispasr]'):s.find('[dependencies.crispasr-sys]')+400])
          for marker in ('crisp-docx-core', 'crisp-docx-llm', 'crisp-docx-align'):
              idx = s.find(marker)
              if idx >= 0:
                  print(s[idx:idx+200])
          "

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            protobuf-compiler \
            build-essential \
            curl \
            wget \
            file

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc -y

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Install cargo-license
        run: cargo install --locked cargo-license

      - name: Download llama-server sidecar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bin
          URL="https://github.com/ggml-org/llama.cpp/releases/download/b8340/${{ matrix.llama_asset }}"
          echo "Downloading $URL"
          curl -fL -o llama.tar.gz "$URL"
          mkdir -p llama-extract
          tar -xzf llama.tar.gz -C llama-extract
          SRV=$(find llama-extract -type f -name llama-server | head -n1)
          if [ -z "$SRV" ]; then
            echo "ERROR: llama-server not found in tarball"
            find llama-extract -maxdepth 3 -type f
            exit 1
          fi
          cp "$SRV" "src-tauri/bin/${{ matrix.sidecar_name }}"
          chmod +x "src-tauri/bin/${{ matrix.sidecar_name }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            find llama-extract -type f -name '*.dylib' -exec cp {} src-tauri/bin/ \;
          else
            find llama-extract -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp {} src-tauri/bin/ \;
          fi
          echo "Contents of src-tauri/bin:"
          ls -la src-tauri/bin/

      - name: Download llama-server sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          $Url = "https://github.com/ggml-org/llama.cpp/releases/download/b8340/${{ matrix.llama_asset }}"
          Write-Host "Downloading $Url"
          Invoke-WebRequest -Uri $Url -OutFile llama.zip
          Expand-Archive -Path llama.zip -DestinationPath llama-extract -Force
          $Srv = Get-ChildItem -Path llama-extract -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $Srv) { throw "llama-server.exe not found in zip" }
          Copy-Item $Srv.FullName "src-tauri/bin/${{ matrix.sidecar_name }}"
          Get-ChildItem -Path llama-extract -Recurse -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName src-tauri/bin/
          }
          Write-Host "Contents of src-tauri/bin:"
          Get-ChildItem src-tauri/bin

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'CrispSorter v__VERSION__'
          releaseBody: 'Automated release from GitHub Actions.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}

      # ── Patch native libs into the bundled .app (macOS arm64 only) ────
      #
      # tauri-action ships the freshly-bundled .app + .dmg without
      # libcrispasr inside Contents/Frameworks, so the binary's
      # @rpath/libcrispasr.1.dylib lookup fails on a clean user
      # machine. Run the bundle script to copy the libs in (recursively
      # walking transitives), then repack the .dmg + .app.tar.gz from
      # the patched .app and `gh release upload --clobber` the
      # replacements over what tauri-action already pushed.
      - name: Patch native libs into .app + repack .dmg / .app.tar.gz (macOS)
        if: matrix.crispasr_lib_asset != '' && runner.os == 'macOS'
        shell: bash
        env:
          # Override the script's local-dev defaults (which look at
          # `$REPO_ROOT/../CrispASR/build-flutter-bundle` — the
          # ~/code/CrispASR sibling layout). On CI the lib bundles get
          # extracted INSIDE the repo at `_sibling/...`, so without
          # these overrides both wrappers skip and the script exits
          # 1 from the trailing `ls *.dylib` under pipefail. This was
          # the v0.1.37 macOS arm64 failure root cause.
          CRISPASR_BUILD_DIR: ${{ github.workspace }}/_sibling/CrispASR/build-flutter-bundle
          CRISPEMBED_BUILD_DIR: ${{ github.workspace }}/_sibling/CrispEmbed/build
        run: |
          set -euo pipefail
          # Workspace migration (commit 7326771, P11) moved target/ from
          # under src-tauri/ to the workspace root. The current canonical
          # location is `target/<rust_target>/...`; the legacy
          # `src-tauri/target/<rust_target>/...` is kept as a fallback so
          # this step still works if a future tweak re-pins target.
          # Walking a non-existent dir with `find` would exit non-zero
          # under set -e + pipefail (the v0.1.39 macOS + Linux failure
          # mode), so guard each candidate first.
          APP_DIR=""
          for dir in \
            "target/${{ matrix.rust_target }}/release/bundle/macos" \
            "src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos"; do
            if [ -d "$dir" ]; then APP_DIR="$dir"; break; fi
          done
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: no bundle/macos dir under target/ or src-tauri/target/"
            find target src-tauri/target -maxdepth 5 -name 'bundle' -type d 2>/dev/null | head
            exit 1
          fi
          APP=$(find "$APP_DIR" -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then echo "ERROR: no .app under $APP_DIR"; exit 1; fi
          REPACK_DMG=1 ./scripts/bundle_macos_native_libs.sh "$APP"
          # tauri also produces an .app.tar.gz alongside (used by the
          # Tauri updater + as a download alternative to .dmg). Recreate
          # it from the patched .app so users updating via tar get the
          # fix too. Use absolute path for the output — `cd $APP_DIR`
          # would otherwise re-evaluate the relative `$TAR_GZ` against
          # the new cwd and fail to find a parent dir for tar to write
          # into (the v0.1.38 macOS arm64 failure mode).
          #
          # Rename the on-disk file to match the name tauri-action
          # uploaded as. tauri-action's macOS upload renames `<name>.app.tar.gz`
          # → `<name>_<arch>.app.tar.gz` where <arch> is aarch64 or x64.
          # Without this rename, our Re-upload step would land the
          # patched tarball next to the unpatched one (different names,
          # so --clobber does nothing), leaving two .app.tar.gz on the
          # release: the v0.1.39 first-success quality bug.
          case "${{ matrix.rust_target }}" in
            aarch64-apple-darwin) TAR_ARCH=aarch64 ;;
            x86_64-apple-darwin)  TAR_ARCH=x64 ;;
            *)                    TAR_ARCH="" ;;
          esac
          BUNDLE_ROOT="$(dirname "$APP_DIR")"
          TAR_GZ=$(find "$BUNDLE_ROOT" -name 'CrispSorter*.app.tar.gz' -type f | head -1)
          if [ -n "$TAR_GZ" ]; then
            DIR="$(cd "$(dirname "$TAR_GZ")" && pwd)"
            if [ -n "$TAR_ARCH" ]; then
              ABS_TAR_GZ="$DIR/CrispSorter_${TAR_ARCH}.app.tar.gz"
            else
              ABS_TAR_GZ="$DIR/$(basename "$TAR_GZ")"
            fi
            echo "Repacking $ABS_TAR_GZ"
            tar -czf "$ABS_TAR_GZ" -C "$APP_DIR" "$(basename "$APP")"
            # If the rename changed the path, drop the now-stale original
            # so Re-upload doesn't pick the wrong (unpatched) file.
            if [ "$ABS_TAR_GZ" != "$DIR/$(basename "$TAR_GZ")" ]; then
              rm -f "$TAR_GZ"
            fi
          fi

      - name: Patch native libs into .deb + repack (Linux)
        if: matrix.crispasr_lib_asset != '' && runner.os == 'Linux'
        shell: bash
        env:
          CRISPASR_BUILD_DIR: ${{ github.workspace }}/_sibling/CrispASR/build-flutter-bundle
          CRISPEMBED_BUILD_DIR: ${{ github.workspace }}/_sibling/CrispEmbed/build
        run: |
          set -euo pipefail
          # Linux's tauri_args doesn't pass `--target` (cargo defaults to
          # the host arch on Linux), so the .deb lands at
          # `target/release/bundle/deb/` — NOT under
          # `target/<rust_target>/release/...` like macOS.  Since the
          # P11 workspace migration (commit 7326771), target/ is at the
          # workspace root; `src-tauri/target/...` paths are kept as
          # fallback. Walk only the dirs that actually exist; passing a
          # non-existent path to `find` makes it exit non-zero even if
          # it found matches elsewhere, and pipefail+set-e then silently
          # kills the step (the v0.1.38 second-run failure mode).
          DEB=""
          for dir in \
            "target/release/bundle/deb" \
            "target/${{ matrix.rust_target }}/release/bundle/deb" \
            "src-tauri/target/release/bundle/deb" \
            "src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb"; do
            if [ -d "$dir" ]; then
              candidate=$(find "$dir" -name '*.deb' -type f | head -1)
              if [ -n "$candidate" ]; then DEB="$candidate"; break; fi
            fi
          done
          if [ -z "$DEB" ]; then
            echo "ERROR: no .deb produced; bundle dirs:"
            find target src-tauri/target -maxdepth 5 -name 'bundle' -type d 2>/dev/null | head
            exit 1
          fi
          ./scripts/bundle_linux_native_libs.sh "$DEB"

      # ── Windows: build the portable .zip (DLLs next to .exe) ─────────
      #
      # Windows resolves DLLs by searching alongside the .exe (not via
      # rpath like macOS, not via DT_RPATH like Linux). tauri-action's
      # NSIS/MSI installer puts DLLs at `<install>/resources/bin/`
      # which the loader can't find, so the bundled installers are
      # broken when features are on. Workaround: skip the installers,
      # zip up the unbundled `target/release/` directory with DLLs
      # co-located. That zip is the primary Windows release artifact.
      - name: Build portable .zip (Windows)
        if: matrix.crispasr_lib_asset != '' && runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$version"
          $target = "${{ matrix.rust_target }}"

          # Locate the freshly built .exe. The Windows matrix's
          # tauri_args does NOT pass `--target x86_64-pc-windows-msvc`
          # (same as Linux — cargo defaults to the host arch), so the
          # exe lands at `target/release/crispsorter.exe`, not under a
          # target-triple subdir. Check the no-triple paths first;
          # keep the triple paths as a fallback in case tauri_args
          # later adds `--target`. Both workspace-root and
          # src-tauri/target/ are checked (same dual-location logic
          # the macOS/Linux post-steps use).
          $exeDir = $null
          foreach ($d in @(
            "target/release",
            "src-tauri/target/release",
            "target/$target/release",
            "src-tauri/target/$target/release"
          )) {
            if (Test-Path "$d/crispsorter.exe") { $exeDir = $d; break }
          }
          if (-not $exeDir) {
            Write-Error "couldn't find crispsorter.exe under target/"
            exit 1
          }
          Write-Host "exe dir: $exeDir"

          # Stage the portable bundle: .exe, all DLLs that the
          # CrispEmbed + CrispASR tarballs dropped into _sibling/,
          # plus any DLLs the build placed alongside the .exe (link-
          # time copies). Tauri's resources/ subtree (sidecars + assets)
          # comes along too — the .exe references them by relative path.
          $stage = "portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$exeDir/crispsorter.exe" $stage/

          # DLLs that ended up next to the .exe at link time.
          Get-ChildItem -Path $exeDir -Filter "*.dll" -File `
            | Copy-Item -Destination $stage/ -Force -ErrorAction SilentlyContinue

          # DLLs the lib tarballs unpacked into _sibling/. The build.rs
          # of crispembed-sys / crispasr-sys also copies these alongside
          # the .exe in some flows, but doing it again here is idempotent.
          foreach ($srcDir in @(
            "_sibling/CrispEmbed/build",
            "_sibling/CrispASR/build-flutter-bundle"
          )) {
            if (Test-Path $srcDir) {
              Get-ChildItem -Path $srcDir -Recurse -Filter "*.dll" -File `
                | Copy-Item -Destination $stage/ -Force -ErrorAction SilentlyContinue
            }
          }

          # The llama-server sidecar lives in resources/bin/ (Tauri's
          # default external-bin layout) — keep it there in the
          # portable zip so the app finds it the same way it would
          # under an installed layout.
          $resBin = "$exeDir/../resources/bin"
          if (Test-Path $resBin) {
            New-Item -ItemType Directory -Force -Path "$stage/resources/bin" | Out-Null
            Copy-Item -Path "$resBin/*" -Destination "$stage/resources/bin/" -Force -Recurse
          }

          Write-Host "Portable contents:"
          Get-ChildItem -Recurse $stage | Select-Object FullName | Format-Table -HideTableHeaders

          $zip = "CrispSorter_${version}_x64-windows-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          Write-Host "Created $zip ($(((Get-Item $zip).Length / 1MB).ToString('F1')) MB)"

          # Delete the broken NSIS/MSI assets tauri-action uploaded to
          # the draft release, then upload the portable .zip in their
          # place. `--clobber` lets a retry of this step overwrite.
          $assets = gh release view $tag --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>$null
          foreach ($name in $assets) {
            if ($name -match '\.exe$|\.msi$') {
              Write-Host "Deleting broken installer asset: $name"
              gh release delete-asset $tag $name --repo "${{ github.repository }}" -y
            }
          }
          gh release upload $tag $zip --clobber --repo "${{ github.repository }}"

      - name: Re-upload patched assets over tauri-action's drafts
        if: matrix.crispasr_lib_asset != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          # Walk only directories that actually exist for this matrix
          # entry: macOS lands artifacts under `target/<rust_target>/`,
          # Linux lands them under `target/`. Same find-on-missing-dir
          # gotcha as the Linux Patch step above.
          find_first() {
            local pattern="$1"; shift
            local dir
            for dir in "$@"; do
              if [ -d "$dir" ]; then
                local hit
                hit=$(find "$dir" -name "$pattern" -type f | head -1)
                if [ -n "$hit" ]; then echo "$hit"; return 0; fi
              fi
            done
          }
          # Workspace-root target/ first (post-7326771), src-tauri/target/
          # as fallback.
          DMG=$(find_first '*.dmg' \
            "target/${{ matrix.rust_target }}/release/bundle/dmg" \
            "src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg")
          TAR_GZ=$(find_first 'CrispSorter*.app.tar.gz' \
            "target/${{ matrix.rust_target }}/release/bundle/macos" \
            "target/${{ matrix.rust_target }}/release/bundle" \
            "src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos" \
            "src-tauri/target/${{ matrix.rust_target }}/release/bundle")
          DEB=$(find_first '*.deb' \
            "target/release/bundle/deb" \
            "target/${{ matrix.rust_target }}/release/bundle/deb" \
            "src-tauri/target/release/bundle/deb" \
            "src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb")
          for asset in "$DMG" "$TAR_GZ" "$DEB"; do
            if [ -n "$asset" ] && [ -f "$asset" ]; then
              echo "Uploading patched $asset → $TAG"
              gh release upload "$TAG" "$asset" --clobber --repo "${{ github.repository }}"
            fi
          done

  # macOS-Intel (x86_64) build removed: GitHub-hosted macos-13 runners are
  # chronically queue-starved (hung releases for hours) AND CrispEmbed ships
  # no macOS-x86_64 lib, so the leg could never link. Re-add a release-optional
  # job here if CrispEmbed adds a macos-x86_64 asset and runners free up.
  # ── Android aarch64 APK ───────────────────────────────────────────────────
  # Separate job because `tauri android build` uses a different flow from
  # tauri-action. Runs on ubuntu with JDK 17 + Android SDK/NDK.
  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      PROTOC: /usr/bin/protoc
    steps:
      - uses: actions/checkout@v4
      - name: Check out sibling CrispEmbed
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: _sibling/CrispEmbed
      - name: Check out sibling CrispASR
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: _sibling/CrispASR
      - name: Check out sibling crisp-docx
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPDOCX_REPO }}
          ref: ${{ env.CRISPDOCX_REF }}
          path: _sibling/crisp-docx

      - name: Rewrite sibling path deps for CI layout
        run: |
          python3 -c "
          import re, pathlib
          p = pathlib.Path('src-tauri/Cargo.toml')
          s = p.read_text()
          s = re.sub(r'path\s*=\s*\"\\.\\./\\.\\./CrispEmbed/([\\w-]+)\"', r'path = \"../_sibling/CrispEmbed/\1\"', s)
          s = re.sub(r'path\s*=\s*\"\\.\\./\\.\\./CrispASR/([\\w-]+)\"', r'path = \"../_sibling/CrispASR/\1\"', s)
          s = re.sub(r'path\s*=\s*\"\\.\\./\\.\\./crisp-docx/crates/([\\w-]+)\"', r'path = \"../_sibling/crisp-docx/crates/\1\"', s)
          p.write_text(s)
          "

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libssl-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 26.3.11579264

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install npm deps
        run: npm ci

      - name: Init Android project
        run: npx tauri android init

      - name: Create bin placeholder
        run: mkdir -p src-tauri/bin && touch src-tauri/bin/.gitkeep

      - name: Build Android APK
        run: |
          # Resolve NDK path (set by setup-android action at runtime)
          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # Export CC/CXX/AR/RANLIB for cross-compilation
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export RANLIB_aarch64_linux_android="$NDK_BIN/llvm-ranlib"
          # Symlink NDK tools for vendored OpenSSL cross-compile
          for tool in ranlib ar strip nm objdump readelf; do
            ln -sf "$NDK_BIN/llvm-$tool" "$NDK_BIN/aarch64-linux-android-$tool"
          done
          export PATH="$NDK_BIN:$PATH"
          npx tauri android build --target aarch64

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          # Create draft release if it doesn't exist yet (Android may
          # finish before the desktop tauri-action jobs).
          gh release view "${TAG}" &>/dev/null || \
            gh release create "${TAG}" --draft --title "${TAG}" --notes "Automated release"
          APK=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            DEST="CrispSorter_${VERSION}_android-aarch64.apk"
            cp "$APK" "$DEST"
            gh release upload "${TAG}" "$DEST" --clobber
            echo "✓ Uploaded $DEST"
          else
            echo "⚠ No APK found"
          fi

  # ── iOS aarch64 IPA ──────────────────────────────────────────────────────
  # Builds the Tauri iOS app on a macOS runner with Xcode.
  # When the APPSTORE_API_KEY_P8 repo secret is set (base64 of the .p8),
  # are set, archives + exports a signed IPA suitable for App Store /
  # TestFlight upload. Otherwise falls back to an unsigned .app.
  release-ios:
    permissions:
      contents: write
    runs-on: macos-14
    env:
      # Step-level `if:` can't reference `secrets.*` directly on
      # workflow_dispatch — proxy through an env var instead.
      HAS_SIGNING_KEY: ${{ secrets.APPSTORE_API_KEY_P8 != '' && 'true' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out sibling CrispEmbed
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: _sibling/CrispEmbed
      - name: Check out sibling CrispASR
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: _sibling/CrispASR
      - name: Check out sibling crisp-docx
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPDOCX_REPO }}
          ref: ${{ env.CRISPDOCX_REF }}
          path: _sibling/crisp-docx

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install npm deps
        run: npm ci

      - name: Rewrite sibling path deps for CI layout
        run: |
          python3 -c "
          import re, pathlib
          p = pathlib.Path('src-tauri/Cargo.toml')
          s = p.read_text()
          s = re.sub(r'path\s*=\s*\"\\.\\./\\.\\./CrispEmbed/([\\w-]+)\"', r'path = \"../_sibling/CrispEmbed/\1\"', s)
          s = re.sub(r'path\s*=\s*\"\\.\\./\\.\\./CrispASR/([\\w-]+)\"', r'path = \"../_sibling/CrispASR/\1\"', s)
          s = re.sub(r'path\s*=\s*\"\\.\\./\\.\\./crisp-docx/crates/([\\w-]+)\"', r'path = \"../_sibling/crisp-docx/crates/\1\"', s)
          p.write_text(s)
          "

      - name: Install protoc
        run: brew install protobuf

      - name: Decode App Store Connect API key
        if: ${{ env.HAS_SIGNING_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_API_KEY_P8 }}" | base64 -d \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ env.APPLE_API_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ env.APPLE_API_KEY_ID }}.p8
          echo "API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${{ env.APPLE_API_KEY_ID }}.p8" >> "$GITHUB_ENV"

      - name: Import Distribution cert + provisioning profile (manual signing)
        if: ${{ env.HAS_SIGNING_KEY }}
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          ASC_PROFILE_BASE64: ${{ secrets.ASC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # Manual signing: import the Distribution .p12 into a temp keychain and
          # install the explicit App Store profile. NO -allowProvisioningUpdates
          # anywhere (it revokes the shared Distribution cert — see appstore.md).
          KC="$RUNNER_TEMP/cs-signing.keychain-db"
          KC_PW="ci-$(uuidgen)"
          echo "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          # DEBUG: which Distribution cert did this repo's IOS_DIST_P12 hold?
          # (sha1 56D3…C632 = L9PHHNLY9Y, 317A15FE…8455 = X48Y45DL9F; the profile
          # is bound to BOTH so either works.)
          security find-identity -v -p codesigning | grep -i "distribution" \
            || { echo "::error::no Distribution identity in keychain — IOS_DIST_P12 bad"; exit 1; }
          # Install the App Store profile into both provisioning-profile dirs.
          echo "$ASC_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/cs.mobileprovision"
          PLIST="$(security cms -D -i "$RUNNER_TEMP/cs.mobileprovision")"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<<"$PLIST")
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"; cp "$RUNNER_TEMP/cs.mobileprovision" "$DIR/$UUID.mobileprovision"
          done
          echo "installed profile UUID $UUID"

      - name: Init iOS project
        run: npx tauri ios init

      - name: Inject PrivacyInfo.xcprivacy into iOS project
        run: |
          # Apple requires this manifest since iOS 17 for apps using
          # Required Reason APIs (NSUserDefaults, file timestamps, disk space).
          DEST="src-tauri/gen/apple/crispsorter_iOS/PrivacyInfo.xcprivacy"
          if [ -d "src-tauri/gen/apple/crispsorter_iOS" ]; then
            cp src-tauri/PrivacyInfo.xcprivacy "$DEST"
            echo "✓ Copied PrivacyInfo.xcprivacy"
          else
            echo "⚠ iOS project dir not found — PrivacyInfo will be missing"
          fi

      - name: Strip alpha from App Icon (Apple rejects alpha in the 1024 marketing icon)
        run: |
          set -euo pipefail
          # Tauri's icon set carries an alpha channel; the App Store 1024 icon
          # (and the home-screen icons) must be opaque or the build is rejected /
          # ships iconless. sips JPEG-roundtrip removes alpha (transparent→white)
          # with system tools only — no brew/imagemagick needed.
          n=0
          while IFS= read -r f; do
            if sips -g hasAlpha "$f" 2>/dev/null | grep -q "hasAlpha: yes"; then
              tmp="$RUNNER_TEMP/$(basename "$f").jpg"
              sips -s format jpeg "$f" --out "$tmp" >/dev/null
              sips -s format png "$tmp" --out "$f" >/dev/null
              n=$((n+1))
            fi
          done < <(find src-tauri/gen/apple -path "*AppIcon.appiconset/*.png" 2>/dev/null)
          echo "flattened $n app-icon png(s) to no-alpha"

      - name: Set export compliance (no non-exempt encryption)
        run: |
          # CrispSorter uses only standard HTTPS/TLS — exempt from export
          # regulations. Setting this in Info.plist prevents App Store
          # Connect from blocking the build on encryption compliance.
          PLIST="src-tauri/gen/apple/crispsorter_iOS/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
            echo "✓ Set ITSAppUsesNonExemptEncryption=false"
            # Purpose strings for frameworks that linked deps REFERENCE, even if
            # unused at runtime. Apple's async static analysis rejects the build
            # otherwise (ITMS-90683, emailed after a "successful" upload → the
            # build never reaches VALID). tauri-plugin-dialog links Photos/
            # PhotosUI on iOS for file/image picking (same class of dep as the
            # file_picker plugin that hit CrispCloud with NSPhotoLibrary…).
            add_str() {
              /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST"
              echo "✓ Set $1"
            }
            add_str NSPhotoLibraryUsageDescription "CrispSorter accesses your photo library only when you pick an image or document to import."
            add_str NSPhotoLibraryAddUsageDescription "CrispSorter saves exported documents to the location you choose."
          else
            echo "⚠ Info.plist not found at $PLIST — will set via API after upload"
          fi

      - name: Create bin placeholder
        run: mkdir -p src-tauri/bin && touch src-tauri/bin/.gitkeep

      - name: Build iOS app (signed for App Store — manual)
        if: ${{ env.HAS_SIGNING_KEY }}
        env:
          PROTOC: /opt/homebrew/bin/protoc
        run: |
          set -euo pipefail
          XCPROJ="src-tauri/gen/apple/crispsorter.xcodeproj"
          PBX="$XCPROJ/project.pbxproj"

          # --- Archive UNSIGNED, then sign at export (-exportArchive). This is
          # the fleet-canonical manual flow (appstore.md: "archive-unsigned →
          # -exportArchive manual signing"). Tauri CLI 2.10 bakes
          # `-allowProvisioningUpdates` into its internal `xcodebuild` call with
          # no opt-out; building the archive with CODE_SIGNING_ALLOWED=NO means
          # that flag has *nothing to provision*, so it can never mint a
          # Development cert or revoke the shared fleet Distribution cert (the
          # footgun appstore.md's HARD constraint #1 forbids). Distribution
          # signing is applied afterwards by `xcodebuild -exportArchive` from
          # ExportOptions.plist (manual, no auth flags). Insert (not sed-replace)
          # the keys — the Tauri-generated project may not contain them (single
          # app target, no Pods, so scoping to our-bundle-id blocks is enough). ---
          python3 - "$PBX" <<'PY'
          import sys, re, pathlib
          p = pathlib.Path(sys.argv[1]); s = p.read_text()
          want = {
            "CODE_SIGN_STYLE": "Manual",
            "DEVELOPMENT_TEAM": "N9XSJ4M3GT",
            "CODE_SIGNING_ALLOWED": "NO",
            "CODE_SIGN_IDENTITY": '""',
            "PROVISIONING_PROFILE_SPECIFIER": '""',
          }
          def patch(block):
            body = block
            for k, v in want.items():
              esc = re.escape(k)
              body = re.sub(rf'^\s*{esc}\s*=\s*[^;]*;\s*\n', '', body, flags=re.M)
            inject = "".join(f"\t\t\t\t{k} = {v};\n" for k, v in want.items())
            return body.replace("buildSettings = {\n", "buildSettings = {\n"+inject, 1)
          # patch every buildSettings block that names our app bundle id
          out, i, n = [], 0, 0
          for m in re.finditer(r'buildSettings = \{.*?\};', s, flags=re.S):
            out.append(s[i:m.start()]); blk = m.group(0)
            if "com.crispstrobe.crispsorter" in blk and "crispsorter.RunnerTests" not in blk:
              blk = patch(blk); n += 1
            out.append(blk); i = m.end()
          out.append(s[i:]); p.write_text("".join(out))
          print(f"patched {n} buildSettings block(s) for unsigned archive")
          PY

          # `tauri ios init` generates the .xcodeproj but not a usable
          # project.xcworkspace; `tauri ios build` then invokes `xcodebuild
          # -workspace <proj>/project.xcworkspace` and dies with "Unable to load
          # workspace" (the real cause of the 2026-07-15 CI failure). Create the
          # minimal self-referential workspace so the build can load it.
          WS_DIR="$XCPROJ/project.xcworkspace"
          if [ ! -f "$WS_DIR/contents.xcworkspacedata" ]; then
            mkdir -p "$WS_DIR"
            cat > "$WS_DIR/contents.xcworkspacedata" <<'WSEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace version="1.0">
            <FileRef location="self:"/>
          </Workspace>
          WSEOF
            echo "created $WS_DIR/contents.xcworkspacedata"
          fi

          # Build frontend + Rust + archive (UNSIGNED) via Tauri. Tauri runs the
          # build server the Rust "Build Phase" needs; its own app-store export
          # can't sign an unsigned archive and is expected to no-op/fail here — we
          # glob for the .xcarchive and do our own manual -exportArchive below.
          echo "=== tauri ios build (unsigned archive) ==="
          npx tauri ios build --export-method app-store-connect 2>&1 | tail -60 || true

          IPA=$(find src-tauri/gen/apple build -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "=== tauri produced no IPA — exporting archive manually ==="
            ARCHIVE=$(find src-tauri/gen/apple build -name "*.xcarchive" -type d 2>/dev/null | head -1)
            [ -n "$ARCHIVE" ] || { echo "::error::no .xcarchive found after tauri ios build"; exit 1; }
            echo "archive: $ARCHIVE"
            # Manual export — NO -allowProvisioningUpdates / auth flags.
            PATH="/usr/bin:$PATH" xcodebuild -exportArchive \
              -archivePath "$ARCHIVE" \
              -exportPath build/ios/export \
              -exportOptionsPlist src-tauri/ExportOptions.plist 2>&1 | tail -40
            IPA=$(find build/ios/export -name "*.ipa" -type f 2>/dev/null | head -1)
          fi
          [ -n "$IPA" ] || { echo "::error::App Store IPA was not produced"; exit 1; }
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "=== signed IPA: $IPA ==="
          WORK=$(mktemp -d); unzip -q "$IPA" -d "$WORK"
          codesign --verify --deep --strict --verbose=2 "$WORK"/Payload/*.app 2>&1 | tail -3

      - name: Build iOS app (unsigned fallback)
        if: ${{ !env.HAS_SIGNING_KEY }}
        env:
          PROTOC: /opt/homebrew/bin/protoc
        run: |
          echo "No APPLE_API_KEY_P8 secret — building unsigned"
          npx tauri ios build 2>&1 || true

          XCPROJ="src-tauri/gen/apple/crispsorter.xcodeproj"
          WS_DIR="$XCPROJ/project.xcworkspace"
          mkdir -p "$WS_DIR"
          cat > "$WS_DIR/contents.xcworkspacedata" << 'WSEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace version="1.0">
            <FileRef location="self:"/>
          </Workspace>
          WSEOF

          if [ -d "$XCPROJ" ]; then
            xcodebuild \
              -project "$XCPROJ" \
              -scheme crispsorter_iOS \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              DEVELOPMENT_TEAM="" \
              build \
              CONFIGURATION_BUILD_DIR="$(pwd)/ios-build" \
              2>&1 | tail -20
          fi

      - name: Validate + upload IPA to App Store Connect
        if: ${{ env.HAS_SIGNING_KEY }}
        run: |
          set -euo pipefail
          IPA="${IPA:-}"
          # Fail loud — a green run must never mean "uploaded nothing".
          [ -n "$IPA" ] && [ -f "$IPA" ] \
            || { echo "::error::no signed IPA to upload (build step should have failed first)"; exit 1; }
          # Read the actual CFBundle* from the IPA so altool's cross-check matches.
          APP=$(unzip -Z1 "$IPA" | grep -oE '^Payload/[^/]+\.app' | head -1)
          unzip -oq "$IPA" "$APP/Info.plist" -d "$RUNNER_TEMP/ipaplist"
          BV=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$RUNNER_TEMP/ipaplist/$APP/Info.plist")
          SV=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$RUNNER_TEMP/ipaplist/$APP/Info.plist")
          echo "uploading CFBundleShortVersionString=$SV CFBundleVersion=$BV"
          # altool needs --apple-id or it can't resolve the app from the bundle id
          # ("Cannot determine the Apple ID from Bundle ID"). Validate is advisory
          # (the upload re-validates server-side and is the real gate).
          echo "=== Validating (advisory) ==="
          xcrun altool --validate-app -f "$IPA" --type ios \
            --apple-id "${{ secrets.APPSTORE_APP_ID }}" \
            --api-key "${{ env.APPLE_API_KEY_ID }}" \
            --api-issuer "${{ env.APPLE_API_ISSUER_ID }}" 2>&1 | tail -15 \
            || echo "::warning::validate reported issues — proceeding to upload (real gate)"
          echo "=== Uploading to App Store Connect ==="
          xcrun altool --upload-package "$IPA" --type ios \
            --apple-id "${{ secrets.APPSTORE_APP_ID }}" \
            --bundle-id "com.crispstrobe.crispsorter" \
            --bundle-version "$BV" \
            --bundle-short-version-string "$SV" \
            --api-key "${{ env.APPLE_API_KEY_ID }}" \
            --api-issuer "${{ env.APPLE_API_ISSUER_ID }}" 2>&1 | tail -25
          echo "✓ IPA uploaded to App Store Connect"

      - name: Upload IPA to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          gh release view "${TAG}" &>/dev/null || \
            gh release create "${TAG}" --draft --title "${TAG}" --notes "Automated release"

          # Prefer signed IPA from export, fall back to unsigned .app
          IPA=$(find build/ios/export -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -n "$IPA" ]; then
            DEST="CrispSorter_${VERSION}_ios-arm64.ipa"
            cp "$IPA" "$DEST"
            gh release upload "${TAG}" "$DEST" --clobber
            echo "✓ Uploaded $DEST"
          else
            APP=$(find ios-build src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP" ]; then
              DEST="CrispSorter_${VERSION}_ios-arm64-unsigned.app.tar.gz"
              tar czf "$DEST" -C "$(dirname "$APP")" "$(basename "$APP")"
              gh release upload "${TAG}" "$DEST" --clobber
              echo "✓ Uploaded $DEST (sideload via AltStore/Xcode)"
            else
              echo "⚠ No IPA or .app found"
            fi
          fi

  # Publish the draft once the 3 required platforms finish (success OR failure).
  # Mobile jobs (Android/iOS) also don't block — they may need extra setup.
  # (macOS-Intel dropped: GitHub has no schedulable macos-13 runner and
  # CrispEmbed ships no macOS-x86_64 lib, so that build can't link anyway.)
  publish:
    needs: [release-required, release-android, release-ios]
    # Gate on the REQUIRED desktop platforms (macOS/Windows/Linux) all
    # succeeding — otherwise a single failing core leg would publish a broken
    # "Latest" (as happened to v0.6.0 when the Windows link failed). always()
    # is still needed so this job is evaluated even when a need "fails", but the
    # release-required.result check skips publish unless every core platform
    # built. Mobile (Android/iOS) stays non-blocking by design. On a manual
    # workflow_dispatch, publish ONLY when the operator set publish=true.
    if: ${{ always() && needs.release-required.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish release draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          echo "Publishing release ${TAG}…"
          gh release edit "${TAG}" --draft=false --latest
          echo "✓ Published ${TAG}"
