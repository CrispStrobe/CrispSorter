name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            rust_target: aarch64-apple-darwin
            llama_asset: llama-b8340-bin-macos-arm64.tar.gz
            sidecar_name: llama-server-aarch64-apple-darwin
            tauri_args: '--target aarch64-apple-darwin'
          - platform: macos-13
            rust_target: x86_64-apple-darwin
            llama_asset: llama-b8340-bin-macos-x64.tar.gz
            sidecar_name: llama-server-x86_64-apple-darwin
            tauri_args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            llama_asset: llama-b8340-bin-win-vulkan-x64.zip
            sidecar_name: llama-server-x86_64-pc-windows-msvc.exe
            tauri_args: ''
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            llama_asset: llama-b8340-bin-ubuntu-vulkan-x64.tar.gz
            sidecar_name: llama-server-x86_64-unknown-linux-gnu
            tauri_args: '--bundles deb,appimage'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            protobuf-compiler \
            build-essential \
            curl \
            wget \
            file

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc -y

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Download llama-server sidecar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bin
          URL="https://github.com/ggml-org/llama.cpp/releases/download/b8340/${{ matrix.llama_asset }}"
          echo "Downloading $URL"
          curl -fL -o llama.tar.gz "$URL"
          mkdir -p llama-extract
          tar -xzf llama.tar.gz -C llama-extract
          SRV=$(find llama-extract -type f -name llama-server | head -n1)
          if [ -z "$SRV" ]; then
            echo "ERROR: llama-server not found in tarball"
            find llama-extract -maxdepth 3 -type f
            exit 1
          fi
          cp "$SRV" "src-tauri/bin/${{ matrix.sidecar_name }}"
          chmod +x "src-tauri/bin/${{ matrix.sidecar_name }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            find llama-extract -type f -name '*.dylib' -exec cp {} src-tauri/bin/ \;
          else
            find llama-extract -type f \( -name '*.so' -o -name '*.so.*' \) -exec cp {} src-tauri/bin/ \;
          fi
          echo "Contents of src-tauri/bin:"
          ls -la src-tauri/bin/

      - name: Download llama-server sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          $Url = "https://github.com/ggml-org/llama.cpp/releases/download/b8340/${{ matrix.llama_asset }}"
          Write-Host "Downloading $Url"
          Invoke-WebRequest -Uri $Url -OutFile llama.zip
          Expand-Archive -Path llama.zip -DestinationPath llama-extract -Force
          $Srv = Get-ChildItem -Path llama-extract -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $Srv) { throw "llama-server.exe not found in zip" }
          Copy-Item $Srv.FullName "src-tauri/bin/${{ matrix.sidecar_name }}"
          Get-ChildItem -Path llama-extract -Recurse -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName src-tauri/bin/
          }
          Write-Host "Contents of src-tauri/bin:"
          Get-ChildItem src-tauri/bin

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'CrispSorter v__VERSION__'
          releaseBody: 'Automated release from GitHub Actions.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}
