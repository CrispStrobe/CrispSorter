name: Search engine contracts

on:
  pull_request:
    paths:
      - 'crates/crisp-search-query/**'
      - 'src-tauri/src/index/**'
      - 'tests/search-contract/**'
      - 'Cargo.lock'
      - '.github/workflows/search-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  query-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/search-contract
      - name: Test production query semantics on a real text index
        run: cargo test --locked --manifest-path tests/search-contract/Cargo.toml -- --test-threads=2
