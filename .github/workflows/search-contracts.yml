name: Search engine contracts

on:
  pull_request:
    paths:
      - 'crates/crisp-search-query/**'
      - 'shared/source_identity.rs'
      - 'shared/source_paths.rs'
      - 'shared/stored_passage.rs'
      - 'crisp-index-protocol/**'
      - 'crisp-index-server/**'
      - 'src-tauri/src/index/**'
      - 'src-tauri/src/bg_ingest/**'
      - 'src-tauri/src/jobs/**'
      - 'src-tauri/src/extractors/**'
      - 'patches/sevenz-rust2/**'
      - 'tests/search-contract/**'
      - 'tests/index-write-contract/**'
      - 'tests/extraction-contract/**'
      - 'tests/server-search-contract/**'
      - 'tests/sevenz-contract/**'
      - 'src-tauri/src/sync/pull.rs'
      - 'src-tauri/src/sync/tauri_commands.rs'
      - 'src-tauri/src/sync/cloud_backup.rs'
      - 'src-tauri/src/cli/mod.rs'
      - 'scripts/evaluate_search_reports.py'
      - 'tests/test_search_evaluation.py'
      - 'Cargo.lock'
      - '.github/workflows/search-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check retrieval metrics and evaluation input safeguards
        run: python3 tests/test_search_evaluation.py -v

  query-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/search-contract
      - name: Test production query semantics on a real text index
        run: cargo test --locked --manifest-path tests/search-contract/Cargo.toml -- --test-threads=2

  index-write-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native index build requirements
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/index-write-contract
      - name: Test durable replacement, recovery, metadata, and job acknowledgement
        run: cargo test --locked --manifest-path tests/index-write-contract/Cargo.toml -- --test-threads=2

  server-search-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native index build requirements
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/server-search-contract
      - name: Test server migrations, HTTP query contracts, and sync cursors
        run: cargo test --locked --manifest-path tests/server-search-contract/Cargo.toml -- --test-threads=2

  extraction-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/extraction-contract
      - name: Test bounded container, MIME, HTML, and text extraction
        run: cargo test --locked --manifest-path tests/extraction-contract/Cargo.toml

  sevenz-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/sevenz-contract
      - name: Test decoder corruption and allocation bounds
        run: cargo test --locked --manifest-path tests/sevenz-contract/Cargo.toml --lib

