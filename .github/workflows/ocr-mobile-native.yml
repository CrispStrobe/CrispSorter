name: OCR mobile native integration

on:
  workflow_dispatch:
    inputs:
      target:
        description: Mobile target to qualify
        type: choice
        default: android-x86_64
        options: [android-x86_64, android-arm64, ios-sim-arm64, all]
      candidate_runtime:
        description: Reuse the pinned error-propagation candidate from run 43307953414 (android-x86_64 only)
        type: boolean
        default: false
      candidate_replay:
        description: Replay retained run 43313212722 APK boundary only, without app/runtime builds (android-x86_64)
        type: boolean
        default: false
  push:
    branches: ['feat/ocr-document-studio', 'feat/ocr-mobile-build', 'feat/ocr-native-validation']
    paths:
      - '.github/workflows/ocr-mobile-native.yml'
      - 'scripts/build_mobile_crispembed.py'
      - 'scripts/ocr_mobile_target_matrix.py'
      - 'scripts/generate-licenses.js'
      - 'scripts/native_license_inventory.mjs'
      - 'tests/scripts/test_native_license_inventory.mjs'
      - 'scripts/test_mobile_shell_probe.py'
      - 'scripts/mobile_native_provenance.py'
      - 'scripts/ocr-mobile-runtime-lock.json'
      - 'scripts/ocr-mobile-ort-lock.json'
      - 'scripts/prepare_mobile_ort.py'
      - 'scripts/prepare_ocr_ios_project.py'
      - 'scripts/prepare_ocr_cargo_env.py'
      - 'scripts/mobile_ocr_webview_smoke.mjs'
      - 'scripts/mobile_ocr_probe_utils.mjs'
      - 'scripts/mobile_ocr_quality.mjs'
      - 'scripts/verify_mobile_docx_export.py'
      - 'scripts/mobile_document_picker.py'
      - 'scripts/ocr_mobile_build_receipt.py'
      - 'scripts/mobile_simulator_smoke.py'
      - 'scripts/test_mobile_shell_probe.py'
      - 'scripts/validate_android_native_libs.py'
      - 'tools/mobile-ocr-probe/**'
      - 'tools/mobile-ort-probe/**'
      - 'tools/ios-shell-probe/**'
      - 'tests/scripts/test_*mobile*'
      - 'src-tauri/Cargo.toml'
      - 'Cargo.lock'
      - 'src-tauri/tauri.ocr-mobile.conf.json'
      - 'src-tauri/src/model_provisioning.rs'
      - 'src-tauri/src/model_storage.rs'
      - 'src-tauri/src/model_storage_types.rs'
      - 'src-tauri/src/index/tauri_commands.rs'
      - 'src-tauri/src/extractors/image_input.rs'
      - 'src-tauri/src/extractors/mod.rs'
      - 'src-tauri/src/model_provisioning/**'
      - 'tests/fixtures/mobile-documents/**'
      - 'src-tauri/src/ocr_workspace.rs'
      - 'src-tauri/src/ocr_text_export.rs'
      - 'src-tauri/src/ocr_atomic_output.rs'
      - 'src-tauri/src/ocr_export_control.rs'
      - 'src-tauri/src/ocr_document_import.rs'
      - 'src-tauri/src/ocr_asset_store.rs'
      - 'src-tauri/src/ocr_photo.rs'
      - 'src-tauri/src/lib.rs'
      - 'src/lib/ocr/**'
      - 'src/lib/components/OcrWorkbench.svelte'
      - 'src/app.html'
      - 'src/app.css'
      - 'src/routes/+page.svelte'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
env:
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  contracts:
    if: github.event_name != 'workflow_dispatch' || !inputs.candidate_replay
    outputs:
      target_matrix: ${{ steps.targets.outputs.matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: repos/CrispSorter
      - name: Select mobile targets
        id: targets
        working-directory: repos/CrispSorter
        env:
          REQUESTED_TARGET: ${{ github.event_name == 'workflow_dispatch' && (inputs.target || 'android-x86_64') || 'all' }}
          CANDIDATE_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_runtime || false }}
        run: |
          if [[ "$CANDIDATE_RUNTIME" == true && "$REQUESTED_TARGET" != android-x86_64 ]]; then
            echo 'Candidate runtime qualification requires target android-x86_64' >&2
            exit 1
          fi
          echo "matrix=$(python3 scripts/ocr_mobile_target_matrix.py "$REQUESTED_TARGET")" >> "$GITHUB_OUTPUT"
      - name: Read immutable feature runtime source
        id: runtime
        working-directory: repos/CrispSorter
        env:
          RUNTIME_LOCK: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_runtime && 'scripts/ocr-mobile-error-propagation-candidate-lock.json' || 'scripts/ocr-mobile-runtime-lock.json' }}
        run: python3 scripts/mobile_qualification_lock.py "$RUNTIME_LOCK" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: ${{ steps.runtime.outputs.source }}
          path: repos/CrispEmbed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify build and fixture contracts
        working-directory: repos/CrispSorter
        run: |
          python3 -m unittest discover -s tests/scripts -p 'test_*mobile*.py' -v
          python3 -m py_compile scripts/build_mobile_crispembed.py scripts/prepare_ocr_ios_project.py scripts/prepare_ocr_cargo_env.py scripts/prepare_mobile_ort.py scripts/ocr_mobile_build_receipt.py scripts/mobile_simulator_smoke.py scripts/mobile_document_picker.py tools/mobile-ocr-probe/prepare.py tools/mobile-ort-probe/make_fixture.py
          python3 - <<'PY'
          import pathlib, runpy
          source = pathlib.Path('tools/mobile-ort-probe')
          fixture = runpy.run_path(str(source / 'make_fixture.py'))
          assert (source / 'add_model.h').read_text() == fixture['generated_header']()
          PY
          node --check scripts/mobile_ocr_webview_smoke.mjs
          node --check scripts/mobile_ocr_quality.mjs
          node --test tests/scripts/test_mobile_ocr_*.mjs
          node --test tests/scripts/test_native_license_inventory.mjs
          python3 -m py_compile tools/ios-shell-probe/run.py
          python3 scripts/test_mobile_shell_probe.py
          bash -n tools/mobile-ocr-probe/run_android.sh tools/mobile-ocr-probe/run_android_app_commands.sh tools/mobile-ocr-probe/run_ios.sh
          c++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only -I ../CrispEmbed/src tools/mobile-ocr-probe/probe.cpp

  mobile:
    # The infrastructure work branch runs contracts while the app integration
    # is prepared. The primary feature branch runs the complete target matrix.
    if: (github.ref_name == 'feat/ocr-document-studio' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || !inputs.candidate_replay)
    needs: contracts
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contracts.outputs.target_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      LICENSES_REQUIRE: '1'
      LICENSES_CARGO_TARGET: ${{ matrix.rust }}
      # The pinned Tauri CLI adds tauri/custom-protocol for packaged mobile builds.
      LICENSES_CARGO_FEATURES: ocr-mobile,tauri/custom-protocol
    steps:
      - name: Set native license metadata path on the runner
        shell: bash
        run: echo "LICENSES_CARGO_METADATA=$RUNNER_TEMP/ocr-mobile-licenses/cargo-metadata.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: repos/CrispSorter
      - name: Read immutable feature runtime source
        id: runtime
        working-directory: repos/CrispSorter
        env:
          RUNTIME_LOCK: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_runtime && 'scripts/ocr-mobile-error-propagation-candidate-lock.json' || 'scripts/ocr-mobile-runtime-lock.json' }}
        run: python3 scripts/mobile_qualification_lock.py "$RUNTIME_LOCK" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: ${{ steps.runtime.outputs.source }}
          submodules: recursive
          path: repos/CrispEmbed
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispASR
          ref: v0.8.32
          path: repos/CrispASR
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/crisp-docx
          ref: ddf7830d8d92e6b59b10874d144a59f163a256e1
          path: repos/crisp-docx
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos/CrispSorter -> target
          shared-key: ocr-mobile-${{ matrix.runtime }}
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repos/CrispSorter/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: runner.os == 'Linux'
        with:
          packages: 'platform-tools'
      - name: Configure Android native toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config protobuf-compiler fonts-dejavu-core
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          ndk_bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          rust_target='${{ matrix.rust }}'
          rust_key="${rust_target//-/_}"
          upper_key="${rust_key^^}"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "NDK_HOME=$ndk"
            echo "OCR_NDK_BIN=$ndk_bin"
            echo "CC_${rust_key}=$ndk_bin/${rust_target}24-clang"
            echo "CXX_${rust_key}=$ndk_bin/${rust_target}24-clang++"
            echo "AR_${rust_key}=$ndk_bin/llvm-ar"
            echo "RANLIB_${rust_key}=$ndk_bin/llvm-ranlib"
            echo "CARGO_TARGET_${upper_key}_LINKER=$ndk_bin/${rust_target}24-clang"
            echo "RUSTFLAGS=-Clink-arg=-landroid -Clink-arg=-llog -Clink-arg=-lOpenSLES -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
          } >> "$GITHUB_ENV"
          for tool in ranlib ar strip nm objdump readelf; do
            ln -sf "$ndk_bin/llvm-$tool" "$ndk_bin/${rust_target}-$tool"
          done
          echo "$ndk_bin" >> "$GITHUB_PATH"
      - name: Prepare iOS project tools
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          if ! command -v protoc >/dev/null; then brew install protobuf; fi
          protoc --version
      - name: Download reviewed Android candidate archive
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/CrispStrobe/CrispSorter/actions/artifacts/13985650215/zip > "$RUNNER_TEMP/ocr-mobile-candidate.zip"
      - name: Validate and stage reviewed Android candidate runtime
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_runtime
        working-directory: repos/CrispSorter
        run: |
          python3 scripts/prepare_ocr_mobile_candidate_runtime.py \
            --source ../CrispEmbed --archive "$RUNNER_TEMP/ocr-mobile-candidate.zip" \
            --output "$RUNNER_TEMP/ocr-mobile-runtime"
          echo "CRISPEMBED_SYS_LIB_DIR=$RUNNER_TEMP/ocr-mobile-runtime/lib" >> "$GITHUB_ENV"
      - name: Build matching native runtime
        if: github.event_name != 'workflow_dispatch' || !inputs.candidate_runtime
        working-directory: repos/CrispSorter
        run: |
          python3 scripts/build_mobile_crispembed.py \
            --source ../CrispEmbed --output "$RUNNER_TEMP/ocr-mobile-runtime" \
            --lock '${{ steps.runtime.outputs.lock }}' \
            --target '${{ matrix.runtime }}' --jobs 2
          echo "CRISPEMBED_SYS_LIB_DIR=$RUNNER_TEMP/ocr-mobile-runtime/lib" >> "$GITHUB_ENV"
      - name: Stage pinned mobile ONNX runtime for existing indexing support
        working-directory: repos/CrispSorter
        run: |
          python3 scripts/prepare_mobile_ort.py --target '${{ matrix.runtime }}' \
            --output "$RUNNER_TEMP/ocr-mobile-ort"
          echo "OCR_ORT_ROOT=$RUNNER_TEMP/ocr-mobile-ort" >> "$GITHUB_ENV"
      - name: Preserve runtime and host compiler paths through nested mobile Cargo calls
        working-directory: repos/CrispSorter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            ort=(--ort-lib-dir "$OCR_ORT_ROOT/lib")
          else
            ort=(--ort-xcframework "$OCR_ORT_ROOT/onnxruntime.xcframework")
          fi
          python3 scripts/prepare_ocr_cargo_env.py --project . \
            --runtime-lib-dir "$CRISPEMBED_SYS_LIB_DIR" \
            --protoc "$(command -v protoc)" "${ort[@]}"
      - name: Prepare immutable synthetic probe inputs
        if: matrix.probe
        working-directory: repos/CrispSorter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'Pillow==11.3.0'
          if [[ "$RUNNER_OS" == Linux ]]; then
            font=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          else
            font=/System/Library/Fonts/Supplemental/Arial.ttf
          fi
          python3 tools/mobile-ocr-probe/prepare.py --output "$RUNNER_TEMP/ocr-mobile-inputs" --font "$font"
      - name: Record exact native backend license metadata
        working-directory: repos/CrispSorter
        run: |
          node scripts/native_license_inventory.mjs prepare --output "$LICENSES_CARGO_METADATA"
      - name: Link actual target photo and inference probe
        working-directory: repos/CrispSorter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            "$OCR_NDK_BIN/${{ matrix.rust }}24-clang++" -std=c++17 -static-libstdc++ \
              -I ../CrispEmbed/src tools/mobile-ocr-probe/probe.cpp \
              -L "$CRISPEMBED_SYS_LIB_DIR" -lcrispembed \
              -Wl,--no-undefined -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384 \
              -o "$RUNNER_TEMP/ocr-mobile-probe"
            "$OCR_NDK_BIN/${{ matrix.rust }}24-clang++" -std=c++17 -static-libstdc++ \
              -I "$OCR_ORT_ROOT/include" tools/mobile-ort-probe/probe.cpp \
              -L "$OCR_ORT_ROOT/lib" -lonnxruntime -Wl,--no-undefined \
              -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384 \
              -o "$RUNNER_TEMP/mobile-ort-probe"
          else
            sdk_path=$(xcrun --sdk iphonesimulator --show-sdk-path)
            xcrun --sdk iphonesimulator clang++ -std=c++17 \
              -target arm64-apple-ios16.0-simulator -isysroot "$sdk_path" \
              -I ../CrispEmbed/src tools/mobile-ocr-probe/probe.cpp \
              "$CRISPEMBED_SYS_LIB_DIR/libcrispembed.a" -lc++ \
              -framework Foundation -framework Metal -framework MetalKit -framework Accelerate \
              -o "$RUNNER_TEMP/ocr-mobile-probe"
            xcrun --sdk iphonesimulator clang++ -std=c++17 \
              -target arm64-apple-ios16.0-simulator -isysroot "$sdk_path" \
              -I "$OCR_ORT_ROOT/include" tools/mobile-ort-probe/probe.cpp \
              "$OCR_ORT_ROOT/onnxruntime.xcframework/ios-arm64_x86_64-simulator/onnxruntime.framework/onnxruntime" \
              -lc++ -framework Foundation -framework CoreML -framework Accelerate \
              -o "$RUNNER_TEMP/mobile-ort-probe"
          fi
      - name: Build Android OCR application
        if: runner.os == 'Linux'
        working-directory: repos/CrispSorter
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mkdir -p src-tauri/bin
          cp "$RUNNER_TEMP/ocr-mobile-runtime/runtime-build.json" src-tauri/bin/ocr-mobile-runtime.json
          cp "$RUNNER_TEMP/ocr-mobile-runtime/notices/"* src-tauri/bin/
          cp "$OCR_ORT_ROOT/notices/LICENSE" src-tauri/bin/onnxruntime-LICENSE.txt
          cp "$OCR_ORT_ROOT/notices/ThirdPartyNotices.txt" src-tauri/bin/onnxruntime-ThirdPartyNotices.txt
          npx tauri android init --ci --config src-tauri/tauri.ocr-mobile.conf.json
          CRISPEMBED_BUILD_DIR="$CRISPEMBED_SYS_LIB_DIR" \
            bash scripts/bundle_android_native_libs.sh --abi '${{ matrix.abi }}' --require-crispembed
          cp "$OCR_ORT_ROOT/lib/libonnxruntime.so" 'src-tauri/gen/android/app/src/main/jniLibs/${{ matrix.abi }}/libonnxruntime.so'
          npx tauri android build --target '${{ matrix.cli }}' --features ocr-mobile \
            --debug --apk --ci --config src-tauri/tauri.ocr-mobile.conf.json
          node scripts/native_license_inventory.mjs verify
          mkdir -p "$RUNNER_TEMP/ocr-mobile-app"
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          apks = [p for p in pathlib.Path('src-tauri/gen/android').rglob('*.apk') if 'androidTest' not in str(p)]
          if len(apks) != 1:
              raise SystemExit(f'Expected one debug APK, found {len(apks)}')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ocr-mobile-app/CrispSorter-ocr.apk'
          shutil.copy2(apks[0], target)
          subprocess.run([str(pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/zipalign'),
                          '-c', '-P', '16', '4', str(target)], check=True)
          PY
          python3 scripts/ocr_mobile_build_receipt.py --platform android \
            --artifact "$RUNNER_TEMP/ocr-mobile-app/CrispSorter-ocr.apk" \
            --runtime-receipt "$RUNNER_TEMP/ocr-mobile-runtime/runtime-build.json" \
            --runtime-lock '${{ steps.runtime.outputs.lock }}' \
            --ort-runtime-receipt "$OCR_ORT_ROOT/ort-runtime.json" \
            --output "$RUNNER_TEMP/ocr-mobile-app/build-receipt.json"
      - name: Build iOS OCR simulator application
        if: runner.os == 'macOS'
        working-directory: repos/CrispSorter
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mkdir -p src-tauri/bin
          cp "$RUNNER_TEMP/ocr-mobile-runtime/runtime-build.json" src-tauri/bin/ocr-mobile-runtime.json
          cp "$RUNNER_TEMP/ocr-mobile-runtime/notices/"* src-tauri/bin/
          cp "$OCR_ORT_ROOT/notices/LICENSE" src-tauri/bin/onnxruntime-LICENSE.txt
          cp "$OCR_ORT_ROOT/notices/ThirdPartyNotices.txt" src-tauri/bin/onnxruntime-ThirdPartyNotices.txt
          npx tauri ios init --ci --config src-tauri/tauri.ocr-mobile.conf.json
          python3 scripts/prepare_ocr_ios_project.py src-tauri/gen/apple/project.yml \
            --ort-framework "$OCR_ORT_ROOT/onnxruntime.xcframework/ios-arm64_x86_64-simulator/onnxruntime.framework/onnxruntime"
          npx tauri ios build --target aarch64-sim --features ocr-mobile \
            --debug --ci --config src-tauri/tauri.ocr-mobile.conf.json
          node scripts/native_license_inventory.mjs verify
      - name: Retain generated native license inventory
        if: always()
        working-directory: repos/CrispSorter
        run: |
          mkdir -p "$RUNNER_TEMP/ocr-mobile-licenses"
          if [[ -f static/licenses.json ]]; then cp static/licenses.json "$RUNNER_TEMP/ocr-mobile-licenses/licenses.json"; fi
      - name: Install pinned Android WebView test driver
        if: matrix.runtime == 'android-x86_64'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/ocr-webview-tools" --no-save --package-lock=false 'playwright@1.62.1'
          echo "PLAYWRIGHT_MODULE_PATH=$RUNNER_TEMP/ocr-webview-tools/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Enable Android emulator acceleration
        if: matrix.runtime == 'android-x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute native OCR, real app model installation and review export on Android
        if: matrix.runtime == 'android-x86_64'
        env:
          OCR_MOBILE_RUNTIME_LOCK: ${{ steps.runtime.outputs.lock }}
          OCR_MOBILE_RUNTIME_SOURCE: ${{ steps.runtime.outputs.source }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash repos/CrispSorter/tools/mobile-ocr-probe/run_android.sh
      - name: Execute native OCR and app startup on iOS
        id: ios_native
        if: runner.os == 'macOS'
        # Bound simulator hangs at the step level so the always-upload step
        # can preserve the compiled, explicitly unqualified bundle and logs.
        timeout-minutes: 15
        working-directory: repos/CrispSorter
        shell: bash
        run: bash tools/mobile-ocr-probe/run_ios.sh
      - name: Verify Tools to OCR workspace navigation in the actual iOS application
        if: runner.os == 'macOS'
        working-directory: repos/CrispSorter
        shell: bash
        timeout-minutes: 12
        env:
          OCR_IOS_APPLICATION: ${{ steps.ios_native.outputs.app }}
          OCR_IOS_SIMULATOR: ${{ steps.ios_native.outputs.simulator }}
        run: |
          python3 tools/ios-shell-probe/run.py \
            --app "$OCR_IOS_APPLICATION" \
            --build-receipt "$RUNNER_TEMP/ocr-mobile-app/build-receipt.json" \
            --output "$RUNNER_TEMP/ocr-mobile-evidence/app-navigation" \
            --simulator "$OCR_IOS_SIMULATOR" --application-source "$GITHUB_SHA"
      - name: Save native runtime, probe and application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-mobile-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/ocr-mobile-runtime/runtime-build.json
            ${{ runner.temp }}/ocr-mobile-runtime/source-lock.json
            ${{ runner.temp }}/ocr-mobile-runtime/candidate-reuse.json
            ${{ runner.temp }}/ocr-mobile-runtime/link-probe-elf.txt
            ${{ runner.temp }}/ocr-mobile-runtime/notices/
            ${{ runner.temp }}/ocr-mobile-licenses/
            ${{ runner.temp }}/ocr-mobile-ort/ort-runtime.json
            ${{ runner.temp }}/mobile-ort-probe
            ${{ runner.temp }}/ocr-mobile-inputs/inputs.json
            ${{ runner.temp }}/ocr-mobile-evidence/
            ${{ runner.temp }}/ocr-mobile-app/
            !${{ runner.temp }}/ocr-mobile-evidence/app-navigation/DerivedData/**
          if-no-files-found: warn
          retention-days: 14

  candidate-boundary-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_replay
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require the narrow Android emulator target
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'android-x86_64' }}
        run: |
          if [[ "$REQUESTED_TARGET" != android-x86_64 ]]; then
            echo 'Retained candidate replay requires target android-x86_64' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: a26ea39776b5510f55a73f0a0fde3f54b0724b20
          path: application-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Stage verified original app and retained PNG without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/CrispStrobe/CrispSorter/actions/artifacts/13991450588 > "$RUNNER_TEMP/candidate-metadata.json"
          gh api repos/CrispStrobe/CrispSorter/actions/artifacts/13991450588/zip > "$RUNNER_TEMP/candidate-artifact.zip"
          python3 harness/tools/android-candidate-boundary/stage.py \
            --archive "$RUNNER_TEMP/candidate-artifact.zip" --metadata "$RUNNER_TEMP/candidate-metadata.json" \
            --app-source application-source --output "$RUNNER_TEMP/candidate-replay"
      - name: Prepare emulator and existing pinned WebView driver
        run: |
          sdkmanager 'build-tools;36.0.0'
          npm install --prefix "$RUNNER_TEMP/ocr-webview-tools" --no-save --package-lock=false 'playwright@1.62.1'
          echo "PLAYWRIGHT_MODULE_PATH=$RUNNER_TEMP/ocr-webview-tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "OCR_REPLAY_APP_SOURCE=$GITHUB_WORKSPACE/application-source" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute only candidate native error and valid-empty app controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash harness/tools/android-candidate-boundary/run.sh
      - name: Retain original app identity and corrected harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-candidate-boundary-replay
          path: |
            ${{ runner.temp }}/candidate-replay/replay-input.json
            ${{ runner.temp }}/candidate-replay/input-receipt.json
            ${{ runner.temp }}/candidate-replay/build-receipt.json
            ${{ runner.temp }}/candidate-replay/runtime-build.json
            ${{ runner.temp }}/candidate-replay/inputs/
            ${{ runner.temp }}/candidate-replay-startup/
            ${{ runner.temp }}/candidate-replay-evidence/
          if-no-files-found: warn
          retention-days: 14
