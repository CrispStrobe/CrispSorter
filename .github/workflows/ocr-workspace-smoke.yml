name: OCR workspace browser verification

on:
  workflow_dispatch:
  push:
    branches: ['feat/ocr-document-studio', 'feat/ocr-native-validation', 'feat/ocr-studio-integration', 'feat/ocr-export-controls', 'feat/ocr-phone-corner-focus']
    paths:
      - src/lib/ocr/**
      - src/lib/tabs.ts
      - src/routes/+page.svelte
      - src/lib/components/OcrWorkbench.svelte
      - src/lib/components/ocr/**
      - tests/ocr-workspace/**
      - .github/workflows/ocr-workspace-smoke.yml
  pull_request:
    paths:
      - src/lib/ocr/**
      - src/lib/tabs.ts
      - src/routes/+page.svelte
      - src/lib/components/OcrWorkbench.svelte
      - src/lib/components/ocr/**
      - tests/ocr-workspace/**
      - .github/workflows/ocr-workspace-smoke.yml

permissions:
  contents: read

concurrency:
  group: ocr-workspace-browser-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ contains(fromJSON('["feat/ocr-document-studio", "feat/ocr-reliability-qualification", "feat/ocr-native-validation", "feat/ocr-studio-integration", "feat/ocr-export-controls", "feat/ocr-phone-corner-focus"]'), github.head_ref || github.ref_name) }}

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate SvelteKit configuration
        run: npx svelte-kit sync
      - name: Install browser verification tools
        run: npm install --prefix "$RUNNER_TEMP/ocr-browser-tools" --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/ocr-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check full frontend types
        run: npm run check
      - name: Test the full frontend suite
        run: npm test -- --run
      - name: Measure large-project history with integrity and byte-budget controls
        run: node tests/ocr-workspace/history-benchmark.mjs test-results/ocr-history-benchmark.json
      - name: Build the production frontend
        run: npm run build
      - name: Verify production workspace interactions
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/ocr-browser-tools/node_modules/playwright
        run: node tests/ocr-workspace/smoke.mjs
      - name: Save browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-workspace-browser-report
          path: |
            tests/ocr-workspace/artifacts/report.json
            tests/ocr-workspace/artifacts/*.png
            test-results/ocr-history-benchmark.json
          if-no-files-found: warn
          retention-days: 14
