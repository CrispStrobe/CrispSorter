name: OCR storage contracts

on:
  workflow_dispatch:
  push:
    branches: ['feat/ocr-document-studio', 'feat/ocr-reliability-qualification', 'feat/ocr-streaming-export']
    paths:
      - src-tauri/src/model_storage.rs
      - src-tauri/src/model_storage_types.rs
      - src-tauri/src/ocr_atomic_output.rs
      - src-tauri/src/ocr_export_control.rs
      - tests/model-storage-contract/**
      - .github/workflows/ocr-model-storage.yml
  pull_request:
    paths:
      - src-tauri/src/model_storage.rs
      - src-tauri/src/model_storage_types.rs
      - src-tauri/src/ocr_atomic_output.rs
      - src-tauri/src/ocr_export_control.rs
      - tests/model-storage-contract/**
      - .github/workflows/ocr-model-storage.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/model-storage-contract
      - name: Test actual model storage, leases, atomic output and export cancellation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          cargo test --locked --manifest-path tests/model-storage-contract/Cargo.toml -- --test-threads=1 --nocapture 2>&1 | tee test-results/model-storage.log
          sha256sum src-tauri/src/model_storage.rs src-tauri/src/model_storage_types.rs src-tauri/src/ocr_atomic_output.rs src-tauri/src/ocr_export_control.rs tests/model-storage-contract/Cargo.lock > test-results/model-storage-sources.sha256
      - name: Retain exact native storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-model-storage-contracts
          path: |
            test-results/model-storage*
            tests/model-storage-contract/Cargo.lock
          retention-days: 30
