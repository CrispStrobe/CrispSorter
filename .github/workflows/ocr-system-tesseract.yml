name: OCR System Tesseract evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src-tauri/src/ocr_word_evidence.rs
      - src-tauri/src/ocr_document.rs
      - tools/quality/check_system_tesseract.py
      - tools/quality/check_ocr_document.py
      - tests/quality/ocr-task.png
      - .github/workflows/ocr-system-tesseract.yml

permissions:
  contents: read

concurrency:
  group: ocr-system-tesseract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Linux recognition provider
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
      - name: Compile production parser, runner, and sandbox gates
        if: runner.os != 'Linux'
        run: python tools/quality/check_system_tesseract.py
      - name: Verify parser, gates, and actual Linux adapter
        if: runner.os == 'Linux'
        run: python tools/quality/check_system_tesseract.py --fixture tests/quality/ocr-task.png
      - name: Verify logical document ranges and source links
        run: python tools/quality/check_ocr_document.py
