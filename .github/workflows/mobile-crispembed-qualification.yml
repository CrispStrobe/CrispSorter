name: Qualify source-pinned mobile CrispEmbed builds

# Builds and links native runtime test programs and retains candidate libraries.
# This does not establish app, simulator, or OCR qualification.
on:
  workflow_dispatch:
    inputs:
      runtime_lock:
        description: 'Committed source lock for this qualification; default preserves the release pin'
        type: string
        default: scripts/crispembed-runtime-lock.json
      target:
        description: 'Original three targets, or one separate Android candidate'
        type: choice
        options: [all, android-armv7, android-x86_64]
        default: all

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.target == 'android-armv7'
            && '[{"runner":"ubuntu-24.04","target":"android-armv7"}]'
            || inputs.target == 'android-x86_64'
            && '[{"runner":"ubuntu-24.04","target":"android-x86_64"}]'
            || '[{"runner":"ubuntu-24.04","target":"android-arm64"},{"runner":"macos-15","target":"ios-arm64"},{"runner":"macos-15","target":"ios-sim-arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: sorter
      - name: Read immutable runtime source lock
        id: runtime
        working-directory: sorter
        shell: bash
        env:
          RUNTIME_LOCK: ${{ inputs.runtime_lock || 'scripts/crispembed-runtime-lock.json' }}
        run: |
          set -euo pipefail
          python3 scripts/mobile_qualification_lock.py "$RUNTIME_LOCK" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: ${{ steps.runtime.outputs.source }}
          path: crispembed
          submodules: recursive
      - name: Build pinned runtime and check dependency closure
        shell: bash
        env:
          RUNTIME_LOCK: ${{ steps.runtime.outputs.lock }}
        run: |
          set -euo pipefail
          cd sorter
          if [[ '${{ matrix.target }}' == android-* ]]; then
            export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?runner has no Android NDK}"
          fi
          python3 scripts/build_mobile_crispembed.py \
            --source ../crispembed --output "$RUNNER_TEMP/crispembed-mobile" \
            --lock "$RUNTIME_LOCK" \
            --target '${{ matrix.target }}' --jobs 4
          cp "$RUNTIME_LOCK" "$RUNNER_TEMP/crispembed-mobile/source-lock.json"
      - name: Link OCR C API probe
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/crispembed-mobile/lib"
          if [[ '${{ matrix.target }}' == android-* ]]; then
            case '${{ matrix.target }}' in
              android-arm64) compiler=aarch64-linux-android24-clang ;;
              android-armv7) compiler=armv7a-linux-androideabi24-clang ;;
              android-x86_64) compiler=x86_64-linux-android24-clang ;;
              *) echo 'Unsupported Android qualification compiler' >&2; exit 1 ;;
            esac
            cc="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$compiler"
            "$cc" -I crispembed/src sorter/scripts/mobile_crispembed_link_probe.c \
              -L "$runtime" -lcrispembed -Wl,--no-undefined -o "$RUNNER_TEMP/ocr-link-probe"
            readelf -h -l "$RUNNER_TEMP/ocr-link-probe" > "$RUNNER_TEMP/crispembed-mobile/link-probe-elf.txt"
          else
            if [[ '${{ matrix.target }}' == ios-sim-arm64 ]]; then
              sdk=iphonesimulator
              triple=arm64-apple-ios15.0-simulator
            else
              sdk=iphoneos
              triple=arm64-apple-ios15.0
            fi
            sdk_path=$(xcrun --sdk "$sdk" --show-sdk-path)
            xcrun --sdk "$sdk" clang -target "$triple" -isysroot "$sdk_path" \
              -I crispembed/src sorter/scripts/mobile_crispembed_link_probe.c \
              "$runtime/libcrispembed.a" -lc++ -framework Foundation -framework Metal \
              -framework MetalKit -framework Accelerate -o "$RUNNER_TEMP/ocr-link-probe"
          fi
      - name: Retain candidate library and provenance
        uses: actions/upload-artifact@v4
        with:
          name: crispembed-mobile-candidate-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/crispembed-mobile/lib/
            ${{ runner.temp }}/crispembed-mobile/notices/
            ${{ runner.temp }}/crispembed-mobile/runtime-build.json
            ${{ runner.temp }}/crispembed-mobile/source-lock.json
            ${{ runner.temp }}/crispembed-mobile/link-probe-elf.txt
            ${{ runner.temp }}/ocr-link-probe
          if-no-files-found: error
          retention-days: 14
