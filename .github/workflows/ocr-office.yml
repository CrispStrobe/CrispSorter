name: OCR reviewed Office packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src-tauri/src/ocr_docx.rs
      - src-tauri/src/ocr_xlsx.rs
      - src-tauri/src/ocr_office.rs
      - src-tauri/src/ocr_document.rs
      - src-tauri/src/ocr_workspace.rs
      - src-tauri/Cargo.toml
      - Cargo.lock
      - tools/quality/check_ocr_office.py
      - tools/quality/ocr_office_fixture.rs
      - .github/workflows/ocr-office.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
jobs:
  production-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Includes the first pinned docx-rs/image dependency build and actual fixture
    # generation; unrelated OCR/model-provider jobs keep their existing limits.
    timeout-minutes: 30
    env:
      OCR_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_NET_RETRY: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute production writer and independently inspect generated packages
        run: |
          python -m pip install openpyxl==3.1.5 et-xmlfile==2.0.0
          python tools/quality/check_ocr_office.py --output target/ocr-office-qualification --require-openpyxl
      - name: Retain packages, exact inputs, logs, locks, and qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-office-${{ runner.os }}
          path: target/ocr-office-qualification/
          if-no-files-found: error
          retention-days: 30
