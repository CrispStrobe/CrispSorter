name: Shared Rust SMB source
on:
  push:
    paths: ['crates/crisp-smb-source/**', 'src-tauri/src/drives/**', 'src-tauri/src/sync/transfer_queue.rs', 'src-tauri/src/operation_log.rs', 'src-tauri/src/cli/**', 'src-tauri/Cargo.toml', 'Cargo.lock', 'src/lib/drives/smbSettings*', 'src/lib/components/IndexIngest.svelte', 'scripts/test_smb_source.py', 'scripts/test_smb_fixture_runner.py', '.github/workflows/smb-source.yml']
  pull_request:
    paths: ['crates/crisp-smb-source/**', 'src-tauri/src/drives/**', 'src-tauri/src/sync/transfer_queue.rs', 'src-tauri/src/operation_log.rs', 'src-tauri/src/cli/**', 'src-tauri/Cargo.toml', 'Cargo.lock', 'src/lib/drives/smbSettings*', 'src/lib/components/IndexIngest.svelte', 'scripts/test_smb_source.py', 'scripts/test_smb_fixture_runner.py', '.github/workflows/smb-source.yml']
  workflow_dispatch:
concurrency:
  group: smb-source-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  direct-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispCloud
          ref: 4b44dc4d44ef05a18d2da2579d2e3b866b245643
          path: .smb-fixture-source
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install impacket==0.13.0
      - run: python -m unittest discover -s scripts -p test_smb_fixture_runner.py
      - run: cargo test --manifest-path crates/crisp-smb-source/Cargo.toml --locked
      - name: Qualify the pinned direct SMB core
        run: |
          set -o pipefail
          mkdir -p test-results/storage
          python scripts/test_smb_source.py .smb-fixture-source 2>&1 | tee test-results/storage/direct-smb.log
      - run: bash scripts/test_mounted_read.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-smb-qualification
          path: test-results/storage/direct-smb.log
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx svelte-kit sync
      - run: npm test -- src/lib/drives/smbSettings.test.ts
      - run: npm run check
