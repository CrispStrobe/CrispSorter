name: Shared Rust SMB source
on:
  push:
    paths: ['crates/crisp-smb-source/**', 'src-tauri/src/drives/**', 'src-tauri/src/cli/**', 'src-tauri/Cargo.toml', 'Cargo.lock', 'src/lib/drives/smbSettings*', 'src/lib/components/IndexIngest.svelte', 'tests/browser/smb-settings.spec.ts', 'scripts/test_smb_source.py', '.github/workflows/smb-source.yml']
  pull_request:
    paths: ['crates/crisp-smb-source/**', 'src-tauri/src/drives/**', 'src-tauri/src/cli/**', 'src-tauri/Cargo.toml', 'Cargo.lock', 'src/lib/drives/smbSettings*', 'src/lib/components/IndexIngest.svelte', 'tests/browser/smb-settings.spec.ts', 'scripts/test_smb_source.py', '.github/workflows/smb-source.yml']
  workflow_dispatch:
jobs:
  direct-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispCloud
          ref: 4b44dc4d44ef05a18d2da2579d2e3b866b245643
          path: .smb-fixture-source
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install impacket==0.13.0
      - run: cargo test --manifest-path crates/crisp-smb-source/Cargo.toml --locked
      - run: python scripts/test_smb_source.py .smb-fixture-source
      - run: bash scripts/test_mounted_read.sh
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx svelte-kit sync
      - run: npm test -- src/lib/drives/smbSettings.test.ts
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/smb-settings.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smb-browser-failure
          path: test-results/

  app-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PROTOC: /usr/bin/protoc
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          path: repos/CrispSorter
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispEmbed
          ref: e14136d3a99572367e68619045943fe77a299caa
          path: repos/CrispEmbed
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispASR
          ref: 0c9a4b6d828feffddc24e13e9140fac89c785214
          path: repos/CrispASR
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/crisp-docx
          ref: ddf7830d8d92e6b59b10874d144a59f163a256e1
          path: repos/crisp-docx
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler libssl-dev libopenblas0
      - working-directory: repos/CrispSorter
        run: |
          mkdir -p src-tauri/bin
          touch src-tauri/bin/.gitkeep
          cargo check -p crispsorter --all-targets --no-default-features --locked
