name: Shared Rust SMB source
on:
  push:
    paths: ['crates/crisp-smb-source/**', 'src-tauri/src/drives/**', 'src-tauri/src/cli/**', 'src-tauri/Cargo.toml', 'Cargo.lock', 'src/lib/drives/smbSettings*', 'src/lib/components/IndexIngest.svelte', 'scripts/test_smb_source.py', '.github/workflows/smb-source.yml']
  pull_request:
    paths: ['crates/crisp-smb-source/**', 'src-tauri/src/drives/**', 'src-tauri/src/cli/**', 'src-tauri/Cargo.toml', 'Cargo.lock', 'src/lib/drives/smbSettings*', 'src/lib/components/IndexIngest.svelte', 'scripts/test_smb_source.py', '.github/workflows/smb-source.yml']
  workflow_dispatch:
jobs:
  direct-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CrispStrobe/CrispCloud
          ref: 4b44dc4d44ef05a18d2da2579d2e3b866b245643
          path: .smb-fixture-source
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install impacket==0.13.0
      - run: cargo test --manifest-path crates/crisp-smb-source/Cargo.toml --locked
      - run: python scripts/test_smb_source.py .smb-fixture-source
      - run: bash scripts/test_mounted_read.sh
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx svelte-kit sync
      - run: npm test -- src/lib/drives/smbSettings.test.ts
      - run: npm run check
