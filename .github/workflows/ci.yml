name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Branches and PRs: superseding a stale run is the right trade — nobody needs a
  # verdict on a commit that has already been replaced.
  #
  # `main` is the opposite: every commit there is something we want verified, and
  # a *cancelled* run is not a green one. It reads as "not red" at a glance, which
  # is exactly how a library that had stopped compiling for everyone survived on
  # main unnoticed — the last completed run had been cancelled, not failed. With
  # several agents pushing to main minutes apart, `cancel-in-progress` meant most
  # runs never reached a conclusion at all.
  #
  # So on main the group is unique per commit (nothing to collide with, nothing
  # cancelled) and cancellation is off; elsewhere the old behaviour stands.
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Sibling repos referenced by src-tauri/Cargo.toml as path deps:
  #   ../../CrispEmbed/crispembed         (existing — embedder + ggml runtime)
  #   ../../CrispASR/crispasr             (existing — ASR + translation)
  #   ../../crisp-docx/crates/crisp-docx-{core,llm,align}  (new — docx surgery + LLM clients)
  # Checked out into repos/{name} so that, from repos/CrispSorter/src-tauri,
  # the relative path resolves correctly without any Cargo.toml rewrite.
  CRISPEMBED_REPO: CrispStrobe/CrispEmbed
  # Pinned to the SAME tag release.yml uses. Previously CI tracked `main`
  # while release pinned v0.13.0, so CI never once built what shipped —
  # three minor versions apart, and the two disagree about the API:
  # `OcrPipelineResult.markdown` / `.reading_order` exist on main and not on
  # v0.13.0, so code using them passes CI and breaks the release build.
  # Keep these two values equal; bump them together.
  CRISPEMBED_REF: v0.17.2
  CRISPASR_REPO: CrispStrobe/CrispASR
  # Pinned to the same tag release.yml uses, for the reason spelled out above
  # CRISPEMBED_REF. This one had drifted 18 patch versions: CI tracked `main`
  # while release pinned v0.8.6. All six prebuilt assets both workflows
  # download were verified present at v0.16.1 / v0.8.24 before bumping.
  CRISPASR_REF: v0.8.24
  CRISP_DOCX_REPO: CrispStrobe/crisp-docx
  CRISP_DOCX_REF: main
  # Cargo network resilience. The license scan runs `cargo metadata` (via
  # cargo-license) which intermittently hits crates.io-index TLS flakes
  # ("SSL_read: SSL_ERROR_SYSCALL" — the known cargo HTTP/2 multiplexing bug):
  # that silently drops the Rust crates from licenses.json and trips the
  # non-trivial-count assertion. Retry hard + disable HTTP/2 multiplexing.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # Fast, cheap checks that run on every push + PR. Full cross-platform
  # Tauri builds live in release.yml and only fire on version tags.
  frontend:
    name: Frontend check + licenses
    runs-on: ubuntu-latest
    steps:
      - name: Check out CrispSorter
        uses: actions/checkout@v4
        with:
          path: repos/CrispSorter

      - name: Check out sibling CrispEmbed (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed

      - name: Check out sibling CrispASR (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR

      - name: Check out sibling crisp-docx (cargo path dep)
        # crisp-docx-align's Cargo.toml has `crispembed = { path =
        # "../../../CrispEmbed/crispembed" }`. From repos/crisp-docx/crates/
        # crisp-docx-align that resolves to repos/CrispEmbed — which we
        # already checked out above. No additional symlink needed.
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISP_DOCX_REPO }}
          ref: ${{ env.CRISP_DOCX_REF }}
          path: repos/crisp-docx

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: repos/CrispSorter/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-license
        run: cargo install --locked cargo-license

      - name: npm ci
        working-directory: repos/CrispSorter
        run: npm ci

      - name: svelte-check
        working-directory: repos/CrispSorter
        run: npm run check

      - name: Unit tests (vitest)
        working-directory: repos/CrispSorter
        run: npm test

      - name: Regenerate licenses.json
        working-directory: repos/CrispSorter
        run: |
          # Warm the crates.io index with retries first, so the cargo-license
          # `cargo metadata` inside generate-licenses.js doesn't drop the Rust
          # crates on a transient index flake (which would fail the
          # non-trivial-count assertion below). cargo-license is already
          # installed by the earlier step.
          for i in 1 2 3 4 5; do
            (cd src-tauri && cargo metadata --format-version 1 >/dev/null 2>&1) && break
            echo "cargo metadata warm-up attempt $i failed; retrying in $((i*5))s…"
            sleep $((i*5))
          done
          npm run licenses:gen

      - name: Assert license list is non-trivial
        # Sanity check so we don't silently ship an empty list if the scan
        # tools break on a runner.
        working-directory: repos/CrispSorter
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('static/licenses.json','utf8')).counts.total)")
          echo "Total licenses: $COUNT"
          test "$COUNT" -gt 100

      - name: Upload licenses.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: licenses-json
          path: repos/CrispSorter/static/licenses.json
          retention-days: 14

  # Rust library tests + the CLI binary, plus the two independent
  # verification harnesses run against that binary.
  #
  # An earlier note here said Rust coverage in CI was impractical because
  # "Tauri's build script requires the llama-server sidecars under
  # src-tauri/bin/". That is only true of *bundling*: there is no
  # `externalBin` in tauri.conf.json, and the `resources: ["bin/*"]` glob is
  # satisfied by an empty directory — which is exactly what release.yml's
  # Android job does with its `bin/.gitkeep` placeholder. `cargo test --lib`
  # and `cargo build --bin` need neither the sidecar nor the bundle.
  #
  # Why it is worth the runner minutes: the harnesses have caught three real
  # bugs that the in-process tests missed, including a `docx` verb family
  # that was unreachable from the command line entirely. They only ever ran
  # on one developer's machine, against a target directory on a disk that
  # periodically fills up.
  rust:
    name: Rust tests + CLI verification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PROTOC: /usr/bin/protoc
      # Sibling path deps resolve relative to repos/CrispSorter/src-tauri,
      # so the repos/ layout below needs no Cargo.toml rewriting.
      CARGO_TERM_COLOR: always
      # The feature-rich Clap command tree is deep enough that parser tests
      # can exceed libtest's small default worker stack on Ubuntu.
      RUST_MIN_STACK: 16777216
    steps:
      - name: Check out CrispSorter
        uses: actions/checkout@v4
        with:
          path: repos/CrispSorter

      - name: Check out sibling CrispEmbed (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed

      - name: Check out sibling CrispASR (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR

      - name: Check out sibling crisp-docx (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISP_DOCX_REPO }}
          ref: ${{ env.CRISP_DOCX_REF }}
          path: repos/crisp-docx

      - name: Install system deps
        # webkit2gtk/gtk are needed at *link* time — the test binary links the
        # lib, which links tao/wry. qpdf + poppler-utils are two of the
        # independent checkers the PDF harness grades against.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            protobuf-compiler \
            libssl-dev \
            libopenblas0 \
            qpdf \
            poppler-utils

      - uses: dtolnay/rust-toolchain@stable

      # ── Prebuilt native libs, so CI can compile the same features release
      #    ships. Without these, `crispembed` / `crispasr` were in no CI job,
      #    and every code path behind them — the OCR pipeline, ASR, LID,
      #    translate-align/nmt — was verified only by a release build, i.e.
      #    after the tag. Steps mirror release.yml's proven ones; only the
      #    sibling path differs (`repos/` here vs `_sibling/` there).
      - name: Download libcrispembed bundle
        working-directory: repos/CrispSorter
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${{ env.CRISPEMBED_REPO }}/releases/download/${{ env.CRISPEMBED_REF }}/crispembed-linux-x86_64.tar.gz"
          echo "Downloading $URL"
          curl -fL -o crispembed-libs.tar.gz "$URL"
          # Flat tarball; crispembed-sys's `has_prebuilt` looks for
          # libcrispembed.* directly under <sibling>/build/.
          mkdir -p ../CrispEmbed/build
          tar -xzf crispembed-libs.tar.gz -C ../CrispEmbed/build
          find ../CrispEmbed/build -maxdepth 2 -name "lib*" | head

      - name: Download libcrispasr bundle
        working-directory: repos/CrispSorter
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${{ env.CRISPASR_REPO }}/releases/download/${{ env.CRISPASR_REF }}/libcrispasr-linux-x86_64.tar.gz"
          echo "Downloading $URL"
          curl -fL -o crispasr-libs.tar.gz "$URL"
          # Tarball top-level dir is `libcrispasr-<platform>/`; strip it so the
          # contents land where crispasr-sys's `try_existing_build` looks first.
          mkdir -p ../CrispASR/build-flutter-bundle
          tar -xzf crispasr-libs.tar.gz -C ../CrispASR/build-flutter-bundle --strip-components=1
          find ../CrispASR/build-flutter-bundle -maxdepth 4 -name "lib*" | head

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos/CrispSorter -> target

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: repos/CrispSorter/package-lock.json

      - name: Build the frontend
        # tauri-build reads `frontendDist: ../build`; the directory has to
        # exist even though nothing here bundles it.
        working-directory: repos/CrispSorter
        run: |
          npm ci
          npm run build

      - name: Create bin placeholder for the resources glob
        working-directory: repos/CrispSorter
        run: mkdir -p src-tauri/bin && touch src-tauri/bin/.gitkeep

      - name: Library tests
        working-directory: repos/CrispSorter
        # `pdf-zpdf` is included so the feature-gated code compiles here too;
        # a `#[cfg(feature = …)]` block that nobody builds is a block nobody
        # checks.
        #
        # The two `drive-*-native` features are here for exactly that reason.
        # `cargo test -p crisp-filen/-p crisp-internxt` below covers the crates,
        # but the *glue* — `drives/{filen,internxt}_native_drive.rs` and the
        # `instantiate` arms in `drives/mod.rs` — only compiles with these on,
        # and previously compiled in no job at all. It had drifted out of
        # buildable state unnoticed as a result.
        #
        # `crispembed` / `crispasr` (+ the two translate features that depend on
        # them) are here for the same reason and were the largest hole: the OCR
        # pipeline, ASR, LID and translate paths were verified only by a release
        # build — i.e. after the tag. One deliberate difference from release: it
        # uses `crispasr-vulkan` / `crispembed-vulkan`, CI the plain CPU
        # features. Those sub-features only select the ggml backend inside the
        # sibling crates, so the CrispSorter code compiled is identical and CI
        # needs no Vulkan SDK; backend-specific breakage stays release-only.
        run: cargo test -p crispsorter --lib --features desktop,sidecars,audio-glint,aitoolkit,cloud-backup,pdf-zpdf,drive-filen-native,drive-internxt-native,crispembed,crispasr,translate-align,translate-nmt,pdf-render

      - name: Build the CLI binary
        working-directory: repos/CrispSorter
        # With `pdf-zpdf`, so the harness's decrypt-with-a-user-password and
        # linearize section runs instead of skipping. That section is the
        # gate on P32.11 Z4 — the claims zpdf is adopted for. The native drive
        # features match the shipped release builds, so the binary CI checks is
        # the binary users get.
        run: cargo build --bin crispsorter -p crispsorter --features desktop,sidecars,audio-glint,pdf-zpdf,drive-filen-native,drive-internxt-native,crispembed,crispasr,translate-align,translate-nmt,pdf-render

      - name: Install the independent checkers
        # None of these share code with what they are checking: MuPDF
        # (pymupdf), pypdf, pikepdf and python-docx are separate
        # implementations, and they also author the fixtures.
        run: python3 -m pip install --break-system-packages --quiet
             pymupdf pypdf pikepdf python-docx

      - name: Verify the PDF surface against qpdf / poppler / MuPDF / pypdf / pikepdf
        working-directory: repos/CrispSorter
        run: |
          CRISP_CLI="$PWD/target/debug/crispsorter" \
          CRISP_WORK="${RUNNER_TEMP}/pdfverify" \
            python3 scripts/verify_pdf_independent.py

      - name: Verify the DOCX surface against python-docx
        working-directory: repos/CrispSorter
        run: |
          CRISP_CLI="$PWD/target/debug/crispsorter" \
          CRISP_WORK="${RUNNER_TEMP}/docxverify" \
            python3 scripts/verify_docx_independent.py

      - name: Upload the CLI binary
        # So a full local disk is never the reason a verified binary is
        # unavailable.
        uses: actions/upload-artifact@v4
        with:
          name: crispsorter-cli-linux-x64
          path: repos/CrispSorter/target/debug/crispsorter
          retention-days: 7

  cloud-backends:
    name: Native cloud crates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out CrispSorter
        uses: actions/checkout@v4
        with:
          path: repos/CrispSorter

      - name: Check out sibling CrispEmbed (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed

      - name: Check out sibling CrispASR (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR

      - name: Check out sibling crisp-docx (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISP_DOCX_REPO }}
          ref: ${{ env.CRISP_DOCX_REF }}
          path: repos/crisp-docx

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: repos/CrispSorter -> target

      - name: Format cloud crates
        working-directory: repos/CrispSorter
        run: |
          rustfmt --edition 2021 --check \
            crates/crisp-internxt-native/src/lib.rs \
            crates/crisp-internxt-native/src/main.rs \
            crates/crisp-filen-native/src/lib.rs \
            crates/crisp-filen-native/src/main.rs

      - name: Test cloud crates
        working-directory: repos/CrispSorter
        run: |
          cargo test -p crisp-internxt --all-targets
          cargo test -p crisp-filen --all-targets

      - name: Clippy cloud crates
        working-directory: repos/CrispSorter
        run: |
          cargo clippy -p crisp-internxt --all-targets --all-features --no-deps -- -D warnings
          cargo clippy -p crisp-filen --all-targets --all-features --no-deps -- -D warnings

      - name: Verify publishable packages
        working-directory: repos/CrispSorter
        run: |
          cargo package -p crisp-internxt --allow-dirty
          cargo package -p crisp-filen --allow-dirty

  cloud-facade:
    name: crisp-cloud-rs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    steps:
      - name: Check out crisp-cloud-rs
        uses: actions/checkout@v4
        with:
          repository: CrispStrobe/crisp-cloud-rs
          path: crisp-cloud-rs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crisp-cloud-rs -> target

      - name: Format facade workspace
        working-directory: crisp-cloud-rs
        run: cargo fmt --all -- --check

      - name: Hermetic facade tests
        working-directory: crisp-cloud-rs
        run: cargo test --workspace --all-targets

      - name: Clippy facade workspace
        working-directory: crisp-cloud-rs
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify facade package manifest
        if: matrix.os == 'ubuntu-24.04'
        working-directory: crisp-cloud-rs
        run: cargo package -p crisp-cloud-rs --allow-dirty

  cloud-live:
    name: Gated cloud live matrix
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      INTERNXT_LOGIN: ${{ secrets.INTERNXT_LOGIN }}
      INTERNXT_PW: ${{ secrets.INTERNXT_PW }}
      FILEN_EMAIL: ${{ secrets.FILEN_EMAIL }}
      FILEN_PASSWORD: ${{ secrets.FILEN_PASSWORD }}
      CRISPSORTER_GOOGLE_ACCESS_TOKEN: ${{ secrets.CRISPSORTER_GOOGLE_ACCESS_TOKEN }}
      CRISPSORTER_ONEDRIVE_ACCESS_TOKEN: ${{ secrets.CRISPSORTER_ONEDRIVE_ACCESS_TOKEN }}
      WEBDAV_TEST_URL: ${{ secrets.WEBDAV_TEST_URL }}
      WEBDAV_TEST_USER: ${{ secrets.WEBDAV_TEST_USER }}
      WEBDAV_TEST_PASS: ${{ secrets.WEBDAV_TEST_PASS }}
      WEBDAV_TEST_INSECURE: ${{ secrets.WEBDAV_TEST_INSECURE }}
    steps:
      - name: Check out CrispSorter
        uses: actions/checkout@v4
        with:
          path: repos/CrispSorter

      - name: Check out sibling CrispEmbed (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed

      - name: Check out sibling CrispASR (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR

      - name: Check out sibling crisp-docx (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISP_DOCX_REPO }}
          ref: ${{ env.CRISP_DOCX_REF }}
          path: repos/crisp-docx

      - uses: dtolnay/rust-toolchain@stable

      - name: Run explicitly configured live tests
        working-directory: repos/CrispSorter
        run: |
          if [ -z "$INTERNXT_LOGIN" ] || [ -z "$INTERNXT_PW" ]; then
            echo "Internxt live tests skipped: workflow secrets are not configured"
          else
            cargo test -p crisp-internxt --test live -- --ignored --nocapture --test-threads=1
          fi
          if [ -z "$FILEN_EMAIL" ] || [ -z "$FILEN_PASSWORD" ]; then
            echo "Filen live tests skipped: workflow secrets are not configured"
          else
            cargo test -p crisp-filen --test filen_live -- --ignored --nocapture --test-threads=1
          fi
          if [ -z "$CRISPSORTER_GOOGLE_ACCESS_TOKEN" ]; then
            echo "Google Drive live tests skipped: workflow secret is not configured"
          else
            cargo test -p crispsorter --lib google_drive::tests::google_drive_live_file_round_trip -- --ignored --nocapture --test-threads=1
          fi
          if [ -z "$CRISPSORTER_ONEDRIVE_ACCESS_TOKEN" ]; then
            echo "OneDrive live tests skipped: workflow secret is not configured"
          else
            cargo test -p crispsorter --lib onedrive::tests::onedrive_live_file_round_trip -- --ignored --nocapture --test-threads=1
          fi
          if [ -z "$WEBDAV_TEST_URL" ]; then
            echo "WebDAV live tests skipped: workflow secret is not configured"
          else
            cargo test -p crispsorter --lib webdav::tests::webdav_live_write_read_delete_roundtrip -- --ignored --nocapture --test-threads=1
          fi
