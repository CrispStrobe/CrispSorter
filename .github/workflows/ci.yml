name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sibling repos referenced by src-tauri/Cargo.toml as path deps:
  #   ../../CrispEmbed/crispembed         (existing — embedder + ggml runtime)
  #   ../../CrispASR/crispasr             (existing — ASR + translation)
  #   ../../crisp-docx/crates/crisp-docx-{core,llm,align}  (new — docx surgery + LLM clients)
  # Checked out into repos/{name} so that, from repos/CrispSorter/src-tauri,
  # the relative path resolves correctly without any Cargo.toml rewrite.
  CRISPEMBED_REPO: CrispStrobe/CrispEmbed
  CRISPEMBED_REF: main
  CRISPASR_REPO: CrispStrobe/CrispASR
  CRISPASR_REF: main
  CRISP_DOCX_REPO: CrispStrobe/crisp-docx
  CRISP_DOCX_REF: main
  # Cargo network resilience. The license scan runs `cargo metadata` (via
  # cargo-license) which intermittently hits crates.io-index TLS flakes
  # ("SSL_read: SSL_ERROR_SYSCALL" — the known cargo HTTP/2 multiplexing bug):
  # that silently drops the Rust crates from licenses.json and trips the
  # non-trivial-count assertion. Retry hard + disable HTTP/2 multiplexing.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # Fast, cheap checks that run on every push + PR. Full cross-platform
  # Tauri builds live in release.yml and only fire on version tags.
  frontend:
    name: Frontend check + licenses
    runs-on: ubuntu-latest
    steps:
      - name: Check out CrispSorter
        uses: actions/checkout@v4
        with:
          path: repos/CrispSorter

      - name: Check out sibling CrispEmbed (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed

      - name: Check out sibling CrispASR (cargo path dep)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR

      - name: Check out sibling crisp-docx (cargo path dep)
        # crisp-docx-align's Cargo.toml has `crispembed = { path =
        # "../../../CrispEmbed/crispembed" }`. From repos/crisp-docx/crates/
        # crisp-docx-align that resolves to repos/CrispEmbed — which we
        # already checked out above. No additional symlink needed.
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRISP_DOCX_REPO }}
          ref: ${{ env.CRISP_DOCX_REF }}
          path: repos/crisp-docx

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: repos/CrispSorter/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-license
        run: cargo install --locked cargo-license

      - name: npm ci
        working-directory: repos/CrispSorter
        run: npm ci

      - name: svelte-check
        working-directory: repos/CrispSorter
        run: npm run check

      - name: Regenerate licenses.json
        working-directory: repos/CrispSorter
        run: |
          # Warm the crates.io index with retries first, so the cargo-license
          # `cargo metadata` inside generate-licenses.js doesn't drop the Rust
          # crates on a transient index flake (which would fail the
          # non-trivial-count assertion below). cargo-license is already
          # installed by the earlier step.
          for i in 1 2 3 4 5; do
            (cd src-tauri && cargo metadata --format-version 1 >/dev/null 2>&1) && break
            echo "cargo metadata warm-up attempt $i failed; retrying in $((i*5))s…"
            sleep $((i*5))
          done
          npm run licenses:gen

      - name: Assert license list is non-trivial
        # Sanity check so we don't silently ship an empty list if the scan
        # tools break on a runner.
        working-directory: repos/CrispSorter
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('static/licenses.json','utf8')).counts.total)")
          echo "Total licenses: $COUNT"
          test "$COUNT" -gt 100

      - name: Upload licenses.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: licenses-json
          path: repos/CrispSorter/static/licenses.json
          retention-days: 14

  # Rust / Tauri compile coverage is already done by release.yml; a separate
  # `cargo check` step was tried but Tauri's build script requires the
  # llama-server sidecars under src-tauri/bin/ which only the release build
  # downloads. Not worth duplicating that download just for CI.
