name: Index backend benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/index-backend-benchmark.yml
      - scripts/benchmark_index_backends.py

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the PostgreSQL benchmark client
        run: |
          python3 -m venv "$RUNNER_TEMP/index-benchmark"
          "$RUNNER_TEMP/index-benchmark/bin/python" -m pip install pg8000==1.31.6
      - name: Run the synthetic benchmark
        run: |
          "$RUNNER_TEMP/index-benchmark/bin/python" scripts/benchmark_index_backends.py index-backend-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-backend-results
          path: index-backend-results.json
