name: Mobile provider checks

on:
  workflow_dispatch:
  push:
    branches: ['mobile-provider-check-*']
  pull_request:
    paths:
      - 'crates/tauri-plugin-mobile-provider/**'
      - 'tools/mobile-provider-check/**'
      - '.github/workflows/mobile-provider-check.yml'

jobs:
  android-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Fetch the exact Tauri Android library from Cargo.lock
        shell: bash
        run: |
          read -r version checksum < <(python3 - <<'PY'
          import tomllib
          with open('Cargo.lock', 'rb') as f:
              package = next(p for p in tomllib.load(f)['package'] if p['name'] == 'tauri')
          print(package['version'], package['checksum'])
          PY
          )
          curl --fail --location --retry 5 "https://static.crates.io/crates/tauri/tauri-${version}.crate" -o "$RUNNER_TEMP/tauri.crate"
          echo "$checksum  $RUNNER_TEMP/tauri.crate" | sha256sum --check
          tar -xf "$RUNNER_TEMP/tauri.crate" -C "$RUNNER_TEMP"
          echo "TAURI_ANDROID_DIR=$RUNNER_TEMP/tauri-$version/mobile/android" >> "$GITHUB_ENV"
      - name: Check the Rust plugin for Android
        shell: bash
        run: |
          cp -a crates/tauri-plugin-mobile-provider "$RUNNER_TEMP/provider-crate"
          cp Cargo.lock "$RUNNER_TEMP/provider-crate/Cargo.lock"
          export NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          cargo check --manifest-path "$RUNNER_TEMP/provider-crate/Cargo.toml" --target aarch64-linux-android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise ContentResolver against a test provider on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle -p tools/mobile-provider-check :mobile-provider:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-provider-test-results
          path: crates/tauri-plugin-mobile-provider/android/build/reports/androidTests/
          if-no-files-found: warn

  ios-provider:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Check the Rust and Swift plugin for iOS
        shell: bash
        run: |
          cp -R crates/tauri-plugin-mobile-provider "$RUNNER_TEMP/provider-crate"
          cp Cargo.lock "$RUNNER_TEMP/provider-crate/Cargo.lock"
          export IPHONEOS_DEPLOYMENT_TARGET=16.0
          cargo check --manifest-path "$RUNNER_TEMP/provider-crate/Cargo.toml" --target aarch64-apple-ios
      - name: Exercise iOS bookmark records and bounded reads
        shell: bash
        working-directory: ${{ runner.temp }}/provider-crate/ios
        run: |
          simulator=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime, devices in d.items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild -scheme tauri-plugin-mobile-provider -destination "platform=iOS Simulator,id=$simulator" -resultBundlePath "$RUNNER_TEMP/provider-ios-tests.xcresult" test CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-provider-test-results
          path: ${{ runner.temp }}/provider-ios-tests.xcresult
          if-no-files-found: warn
