[package]
name        = "crisp-index-protocol"
version     = "0.1.0"
edition     = "2021"
description = "Wire-format types shared between CrispSorter (client) and crisp-index-server (Axum backend)."
license     = "AGPL-3.0-or-later"
authors     = ["CrispSorter contributors"]

[dependencies]
serde      = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
