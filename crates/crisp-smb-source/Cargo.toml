[package]
name = "crisp-smb-source"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
# Keep qualification independent of the app's unrelated sibling checkouts.
[workspace]
[dependencies]
crisp_smb = { git = "https://github.com/CrispStrobe/CrispCloud", rev = "4b44dc4d44ef05a18d2da2579d2e3b866b245643" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
[dev-dependencies]
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
