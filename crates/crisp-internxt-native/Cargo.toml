[package]
name = "crisp-internxt-native"
version = "0.1.0"
edition = "2021"
description = "Reusable native Internxt Cloud Drive protocol client and test CLI"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CrispStrobe/CrispSorter"

[lib]
name = "crisp_internxt_native"
path = "src/lib.rs"

[[bin]]
name = "crisp-internxt"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1.0.102"
cbc = "0.1"
clap = { version = "4.6", features = ["derive"] }
cipher = "0.4"
ctr = "0.9"
getrandom = "0.2"
hex = "0.4"
md-5 = "0.10"
pbkdf2 = "0.12"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
# Independent MIT reference implementation used only for crypto conformance;
# the production client remains purpose-built in this crate.
internxt-core = { path = "../internxt-core", default-features = false }
